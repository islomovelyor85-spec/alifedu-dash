  const daily = d.daily || [], tgt = daily.filter(r => r.source === 'Target'), dm = dmRows().filter(inR), br = d.brDaily || [], brT = br.filter(r => r.source === 'Target');
  const checks = [
    ['Jami leadlar', sum(daily, r => r.leads), sum(dm, r => r.all_leads), sum(br, r => r.leads)],
    ['Target leadlar', sum(tgt, r => r.leads), sum(dm, r => r.ad_leads), sum(brT, r => r.leads)],
    ['Target sifatli', sum(tgt, r => r.qual), sum(dm, r => r.qual), sum(brT, r => r.qual)],
    ['Barcha sifatli', sum(daily, r => r.qual), null, sum(br, r => r.qual)],
    ['Xarajat $', sum(d.spend || [], r => r.spend), sum(dm, r => r.spend), sum(d.brSpend || [], r => r.spend)],
    ['Meta natija', sum(d.spend || [], r => r.meta_leads), sum(dm, r => r.meta_leads), sum(d.brSpend || [], r => r.meta_leads)],
  ];
  const f = (v, k) => v == null ? '<span class="text-muted">—</span>' : k.includes('$') ? '$' + (+v).toFixed(2) : num(v);
  const ok = r => { const xs = r.slice(1).filter(v => v != null); return xs.every(v => Math.abs(v - xs[0]) < 0.01 * Math.max(1, Math.abs(xs[0]))); };
  const checkCard = card(h3("Raqamlar mosligi", `Tanlangan davr (${fmtDay(S.from)} — ${fmtDay(S.to)}) uchun bir xil ko'rsatkich uch sahifada qanday chiqyapti. Farq bo'lsa — odatda bugungi kun hali saqlanmagani yoki sinxronizatsiya davom etayotgani; «Yangilash»ni bosing.`) + table([
    { t: "Ko'rsatkich", f: r => r[0] }, { t: 'Umumiy / Kunlar', r: 1, f: r => f(r[1], r[0]) }, { t: 'Kunlik metrikalar', r: 1, f: r => f(r[2], r[0]) },
    { t: 'Filiallar', r: 1, f: r => f(r[3], r[0]) }, { t: 'Holat', f: r => ok(r) ? chip('mos', 'success') : chip('farq bor', 'danger') },
  ], checks), 'mb-6');
  return checkCard + `<div class="grid lg:grid-cols-2 gap-4">${GUIDE.map(([title, items]) => card(h3(title) + items.map(([k, v]) =>
    `<div class="py-2 border-b border-line/50 last:border-0"><div class="text-[13px] font-semibold">${k}</div><div class="text-[13px] text-muted mt-0.5 leading-relaxed whitespace-normal">${v}</div></div>`).join(''))).join('')}</div>`;
}

// ---- Speed to lead: minutes from lead creation to the first call (any direction, answered or not).
const tkTime = t => t ? new Date(t).toLocaleString('sv-SE', { timeZone: 'Asia/Tashkent' }).slice(5, 16) : '—';
function speedPage() {
  // minutes = working-time wait (a night lead counts from 09:00); raw = clock time since the lead arrived.
  const all = (S.data.speed || []).filter(r => !S.source || r.source === S.source).map(r => ({ ...r, raw: r.minutes, minutes: r.work_minutes ?? r.minutes }));
  if (!all.length) return card(empty("Hali ma'lumot yo'q: qo'ng'iroqlar tarixi yuklanmoqda (bir necha daqiqa)."));
  const called = all.filter(r => r.minutes != null), notCalled = all.filter(r => r.first_call_at == null);
  const med = xs => { const a = xs.map(Number).sort((x, y) => x - y); return a.length ? (a.length % 2 ? a[(a.length - 1) / 2] : (a[a.length / 2 - 1] + a[a.length / 2]) / 2) : null; };
  const share = (xs, m) => xs.length ? xs.filter(r => +r.minutes <= m).length / xs.length : null;
  const work = called.filter(r => r.hour >= 9 && r.hour < 20);
  const fm = v => v == null ? '—' : v < 60 ? `${(+v).toFixed(1)} daq` : `${(v / 60).toFixed(1)} soat`;
  const group = (key, name) => Object.values(all.reduce((m, r) => { const k = r[key] ?? '—'; const o = m[k] ??= { k, name: name(k), n: 0, xs: [], none: 0 }; o.n++; if (r.minutes != null) o.xs.push(+r.minutes); else if (!r.first_call_at) o.none++; return m; }, {}))
    .map(o => ({ ...o, avg: o.xs.length ? o.xs.reduce((a, b) => a + b, 0) / o.xs.length : null, med: med(o.xs), in5: o.xs.length ? o.xs.filter(x => x <= 5).length / o.xs.length : null }));
  const cols = first => [{ t: first, f: r => esc(r.name) }, { t: 'Leadlar', r: 1, f: r => num(r.n) }, { t: "O'rtacha", r: 1, f: r => fm(r.avg) }, { t: 'Mediana', r: 1, f: r => fm(r.med) }, { t: '5 daq ichida', r: 1, f: r => pct(r.in5) }, { t: "Qo'ng'iroq qilinmagan", r: 1, f: r => r.none ? chip(num(r.none), 'danger') : '0' }];
  const hours = group('hour', h => `${String(h).padStart(2, '0')}:00`).sort((a, b) => a.k - b.k), maxMed = Math.max(...hours.map(h => h.med || 0), 1);
  return `<div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">${kpiTile('Mediana', fm(med(called.map(r => r.minutes))), `ish vaqti bo'yicha · soat bo'yicha: ${fm(med(called.map(r => +r.raw)))}`, 'blue')}${kpiTile("O'rtacha", fm(avgOf(called, r => +r.minutes)), `ish vaqti · 09–20 da kelganlar medianasi ${fm(med(work.map(r => r.minutes)))}`, 'amber')}${kpiTile('5 daqiqa ichida', pct(share(called, 5)), 'eng yaxshi amaliyot', 'green')}${kpiTile('1 soat ichida', pct(share(called, 60)), '', 'teal')}${kpiTile("Qo'ng'iroq qilinmagan", num(notCalled.length), `${num(all.length)} leaddan`, 'rose')}</div>
  ${speedExplain(called, notCalled, all, med, fm)}
  <div class="grid lg:grid-cols-2 gap-4 mb-6">${card(h3('Manbalar bo\'yicha', "«Звонок» va filial orqali kelgan leadlarda 0 daqiqa — mijozning o'zi qo'ng'iroq qilgan, kutish yo'q.") + table(cols('Manba'), group('source', k => k).sort((a, b) => b.n - a.n)))}
  ${card(h3("Lead kelgan soat bo'yicha", 'Mediana, daqiqa — kechasi kelgan leadlar ertalab qo\'ng\'iroq qilinadi') + hours.map(h => `<div class="flex items-center justify-between gap-3 py-1 text-[12.5px]"><span class="tabular-nums w-12">${h.name}</span>${bar(h.med || 0, maxMed, (h.med ?? 0) <= 5 ? 'green' : (h.med ?? 0) <= 30 ? 'amber' : 'rose', fm(h.med))}<span class="text-muted tabular-nums w-10 text-right">${num(h.n)}</span></div>`).join(''))}</div>
  ${card(h3("Operatorlar bo'yicha", "Leadga birinchi qo'ng'iroq qilgan operator") + table(cols('Operator'), group('first_operator', id => opNameOf(id)).filter(o => o.k !== '—').sort((a, b) => b.n - a.n)), 'mb-6')}
  ${card(h3("Kunlar bo'yicha", "Har bir kun leadlari: qanchasiga qo'ng'iroq qilindi va qancha kutishdi") + table([
    { t: 'Kun', f: r => fmtDay(r.k), s: r => r.k }, { t: 'Leadlar', r: 1, f: r => num(r.n) }, { t: "Qo'ng'iroq qilindi", r: 1, f: r => num(r.xs.length) },
    { t: 'Javob berdi', r: 1, f: r => num(r.ans) }, { t: "Qo'ng'iroq qilinmagan", r: 1, f: r => r.none ? chip(num(r.none), 'danger') : '0' },
    { t: '5 daq ichida', r: 1, f: r => pct(r.in5) }, { t: 'Mediana (ish vaqti)', r: 1, f: r => fm(r.med) }, { t: "O'rtacha (ish vaqti)", r: 1, f: r => fm(r.avg) },
  ], group('day', k => k).map(o => ({ ...o, ans: all.filter(r => r.day === o.k && r.first_answer_at).length })).sort((a, b) => b.k.localeCompare(a.k))), 'mb-6')}
  ${card(h3('Barcha leadlar — aloqa kesimi', `Tanlangan davrdagi har bir lead (${num(all.length)} ta${S.source ? ', manba: ' + esc(S.source) : ''}). Bitta kunni tanlasangiz — o'sha kunning hammasi. Lead raqamini bosing — Bitrix'da ochiladi.`) + table([
    { t: 'Lead', f: r => `<a href="${BX_LEAD(r.bitrix_id)}" target="_blank" rel="noopener" class="text-accent hover:underline">#${r.bitrix_id}</a>` },
    { t: 'Kelgan', f: r => tkTime(r.created_at), s: r => r.created_at }, { t: 'Manba', f: r => esc(r.source) }, { t: "Mas'ul", f: r => esc(opNameOf(r.manager_id)) },
    { t: "1-qo'ng'iroq", f: r => r.first_call_at ? tkTime(r.first_call_at) : chip("qilinmagan", 'danger'), s: r => r.first_call_at || '' },
    { t: 'Kutish (ish vaqti)', r: 1, f: r => r.minutes == null ? '—' : chip(fm(r.minutes), r.minutes <= 5 ? 'success' : r.minutes <= 30 ? 'warn' : 'danger'), s: r => r.minutes ?? 1e9 },
    { t: 'Kutish (soat)', r: 1, f: r => fm(r.raw), s: r => r.raw ?? 1e9 }, { t: "Qo'ng'iroqlar", r: 1, f: r => num(r.calls) },
    { t: 'Javob berdi', f: r => r.first_answer_at ? tkTime(r.first_answer_at) : '<span class="text-muted">yo\'q</span>', s: r => r.first_answer_at || '' },
    { t: 'Holat', f: r => esc(r.status_name || r.status) },
  ], [...all].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))), null, S.speedLimit) +
    (all.length > S.speedLimit ? `<button onclick="S.speedLimit+=300;render()" class="mt-3 h-9 px-4 rounded-xl bg-surface2 text-sm font-semibold">Yana ko'rsatish (${num(all.length - S.speedLimit)} qoldi)</button>` : ''))}`;
}

// Plain-language median plus how many leads waited how long, so the KPI is easy to check.
function speedExplain(called, notCalled, all, med, fm) {
  const m = med(called.map(r => r.minutes)), avg = avgOf(called, r => +r.minutes);
  const B = [['5 daqiqagacha', 0, 5, 'green'], ['5–15 daqiqa', 5, 15, 'teal'], ['15–30 daqiqa', 15, 30, 'amber'], ['30–60 daqiqa', 30, 60, 'amber'], ['1–3 soat', 60, 180, 'rose'], ['3 soatdan ko\'p', 180, Infinity, 'rose']];
  const rows = B.map(([t, lo, hi, c]) => ({ t, c, n: called.filter(r => +r.minutes > lo - (lo ? 0 : 1) && +r.minutes <= hi).length }));
  rows.push({ t: "Qo'ng'iroq qilinmagan", c: 'crimson', n: notCalled.length });
  const max = Math.max(1, ...rows.map(r => r.n));
  return `<div class="grid lg:grid-cols-2 gap-4 mb-6">${card(h3('Mediana nima va bu raqam nimani bildiradi') + `<div class="text-[13.5px] space-y-2.5">
      <p><b>Mediana = ${fm(m)}.</b> Qo'ng'iroq qilingan ${num(called.length)} ta leadni kutish vaqti bo'yicha qatorga tizsak, aynan o'rtadagi lead ${fm(m)} kutgan. Ya'ni <b>leadlarning yarmiga ${fm(m)} dan tez</b>, qolgan yarmiga sekinroq qo'ng'iroq qilingan.</p>
      <p><b>O'rtacha = ${fm(avg)}.</b> Bir nechta juda kech qo'ng'iroq (masalan, ertasi kuni) o'rtachani ko'tarib yuboradi. Shuning uchun asosiy ko'rsatkich — mediana: u «odatdagi» leadni ko'rsatadi.</p>
      <p><b>Ish vaqti bo'yicha</b> hisoblanadi: lead 20:00–09:00 orasida kelsa, kutish ertalab 09:00 dan sanaladi (operator tunda ishlamaydi). Soat bo'yicha (tun ham hisoblanganda) qiymat KPI kartochkasi ostida yozilgan.</p>
      <p class="text-muted text-[12.5px]">Maqsad: mediana 5 daqiqadan past va «3 soatdan ko'p» + «qo'ng'iroq qilinmagan» — nolga yaqin.</p></div>`)}
    ${card(h3('Leadlar qancha kutdi', `${num(all.length)} ta lead — kutish oralig'i bo'yicha. Medianani shu yerdan tekshirish mumkin: yuqoridan sanab yarmiga yetgan qator.`) + rows.map(r => `<div class="flex items-center justify-between gap-3 py-1.5 text-[13px]"><span class="w-40 shrink-0">${r.t}</span>${bar(r.n, max, r.c, num(r.n))}<span class="text-muted tabular-nums w-14 text-right">${pct(div(r.n, all.length))}</span></div>`).join(''))}</div>`;
}

// ---- Status & reminders: sync health, AI queue, saved days, and alerts from the daily metrics.
function statusPage() {
  const d = S.data, now = Date.now(), ago = t => t ? Math.round((now - new Date(t)) / 60000) : null;
  const fmtAgo = m => m == null ? 'hech qachon' : m < 60 ? `${m} daq oldin` : m < 1440 ? `${Math.round(m / 60)} soat oldin` : `${Math.round(m / 1440)} kun oldin`;
  const SRC = { bitrix_leads: ['Bitrix leadlar', 90], bitrix_deals: ['Bitrix deallar', 90], bitrix_won_history: ['Bitrix sotuvlar tarixi', 90], meta: ['Meta reklama', 90], bitrix_calls: ["Bitrix qo'ng'iroqlar", 20] };
  const syncRows = (d.sync || []).filter(r => SRC[r.source]).map(r => { const m = ago(r.last_run_at); return { ...r, m, name: SRC[r.source][0], ok: !r.last_error && m != null && m <= SRC[r.source][1] }; });
  const saved = (d.dm || [])[0], qd = d.queue || {};
  // Alerts: yesterday vs the 7 saved days before it.
  const rows = dmRows().filter(r => !r.live), y = rows[0], base = rows.slice(1, 8), alerts = [];
  const avg = f => avgOf(base, r => { const v = f(r); return v != null && isFinite(v) ? v : null; });
  const rule = (key, thr, msg, action) => {
    const m = DM.find(x => x[0] === key), v = y && m[2](y), b = avg(m[2]);
    if (v == null || b == null || !isFinite(v) || !b) return;
    const ch = (v - b) / Math.abs(b);
    if (ch * m[4] < -thr) alerts.push({ level: Math.abs(ch) > thr * 2 ? 'danger' : 'warn', title: `${m[1]}: ${fmtM(v, m[3])} (7 kunlik o'rtacha ${fmtM(b, m[3])}, ${ch > 0 ? '+' : ''}${(ch * 100).toFixed(0)}%)`, msg, action });
  };
  rule('cpl', 0.2, "Meta natija narxi oshdi.", "Kreativlar sahifasida CPL eng oshgan reklamani toping; chastota >3 bo'lsa kreativni yangilang.");
  rule('qual_pct', 0.2, 'Sifatli lid ulushi tushdi.', "Lead tahlilida sifatsiz sabablarni (boshqa viloyat, yosh, SPAM) tekshiring; formaga savol qo'shing.");
  rule('unr_pct', 0.2, "Bog'lanib bo'lmaganlar ko'paydi.", "Aloqa tezligi sahifasini tekshiring: kechikkan qo'ng'iroqlar va operator yuklamasi.");
  rule('first_call_min', 0.3, "Birinchi qo'ng'iroq kechikmoqda.", 'Yangi leadlarga 5 daqiqa ichida qo\'ng\'iroq qilishni nazorat qiling.');
  rule('reach', 0.15, "Meta leadlari Bitrix'ga kamroq yetib bormoqda.", "Meta forma → Bitrix integratsiyasini tekshiring (dublikat yoki yo'qolgan leadlar).");
  rule('cpql', 0.25, 'Sifatli lid narxi oshdi.', "Budjetni CPQL eng past reklamalarga o'tkazing.");
  const todayNotCalled = (d.speed || []).filter(r => !r.first_call_at && r.source === 'Target' && now - new Date(r.created_at) > 15 * 60000 && r.day === iso(new Date())).length;
  if (todayNotCalled) alerts.unshift({ level: 'danger', title: `Bugun ${todayNotCalled} ta reklama leadiga hali qo'ng'iroq qilinmagan (15 daqiqadan ko'p)`, msg: '', action: "Aloqa tezligi → «Qo'ng'iroq qilinmagan leadlar» ro'yxatini oching." });
  if (qd.failed > 20) alerts.push({ level: 'warn', title: `AI tahlilida ${qd.failed} ta qo'ng'iroq xato bilan to'xtagan`, msg: "Odatda bepul Gemini kunlik limiti tugaganda bo'ladi; ertasi kuni avtomatik qayta uriniladi.", action: '' });
  for (const r of syncRows.filter(r => !r.ok)) alerts.push({ level: 'danger', title: `${r.name} sinxronizatsiyasi to'xtagan (${fmtAgo(r.m)})`, msg: r.last_error ? esc(r.last_error).slice(0, 200) : '', action: '' });
  const tone = { danger: 'border-danger/40 bg-danger/5', warn: 'border-warn/40 bg-warn/5', info: 'border-line' };
  return `<div class="grid lg:grid-cols-3 gap-4 mb-6">
    ${card(h3("Ma'lumot oqimi", 'Oxirgi sinxronizatsiya') + syncRows.map(r => `<div class="flex justify-between gap-3 py-1.5 text-[13px] border-b border-line/50 last:border-0"><span>${r.ok ? '🟢' : '🔴'} ${r.name}</span><span class="text-muted">${fmtAgo(r.m)}</span></div>`).join(''))}
    ${card(h3("AI qo'ng'iroq tahlili", 'Oxirgi 3 kun') + [["Navbatda", qd.pending], ["Oxirgi 24 soatda tahlil qilindi", qd.done24], ['Xato (qayta uriniladi)', qd.failed]].map(([t, v]) => `<div class="flex justify-between gap-3 py-1.5 text-[13px] border-b border-line/50 last:border-0"><span>${t}</span><b class="tabular-nums">${num(v)}</b></div>`).join(''))}
    ${card(h3('Kunlik metrikalar', 'Avto-saqlash har kuni 01:05 da') + `<div class="text-[13px] py-1.5">Oxirgi saqlangan kun: <b>${saved ? fmtDay(saved.day) : '—'}</b></div><div class="text-[13px] py-1.5 text-muted">Saqlangan vaqti: ${saved ? fmtAgo(ago(saved.saved_at)) : '—'}</div><div class="text-[13px] py-1.5 text-muted">Jami saqlangan kunlar: ${num((d.dm || []).length)}</div>`)}
  </div>
  ${card(h3('Eslatmalar', y ? `Kecha (${fmtDay(y.day)}) oldingi 7 kunlik o'rtacha bilan solishtirildi` : '') + (alerts.length ? alerts.map(a => `<div class="rounded-2xl border ${tone[a.level]} p-4 mb-3 last:mb-0"><div class="font-semibold text-[13.5px]">${a.level === 'danger' ? '🔴' : '🟠'} ${a.title}</div>${a.msg ? `<div class="text-[13px] mt-1">${a.msg}</div>` : ''}${a.action ? `<div class="text-[13px] mt-1 text-accent"><i class="ph-bold ph-arrow-right"></i> ${a.action}</div>` : ''}</div>`).join('') : `<div class="text-[13px] py-4">✅ Hammasi me'yorida: kechagi ko'rsatkichlar 7 kunlik o'rtachadan sezilarli yomonlashmagan.</div>`))}`;
}

const VIEWS = { overview, funnel, daily, leads, money: moneyPage, cohort, creatives, pains, managers, calls, speed: speedPage, metrics: metricsPage, branches: branchesPage, status: statusPage, guide: guidePage, briefs, ai, settings };
function render() { $('app').innerHTML = shell(S.data.funnel ? VIEWS[S.page]() : card(empty('Yuklanmoqda…'))); }
// Starts the Meta / Bitrix / call syncs now (sync-now waits up to ~55 s), then reloads the data.
async function syncNow() {
  S.syncing = true; render();
  try {
    const { data } = await sbc.auth.getSession();
    const res = await fetch(`${SB_URL}/functions/v1/sync-now`, { method: 'POST', headers: { authorization: `Bearer ${data.session?.access_token}`, apikey: SB_KEY } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || res.status);
  } catch (e) { alert("Yangilab bo'lmadi: " + e.message); }
  S.syncing = false; await refresh();
}
async function refresh() {
  $('app').innerHTML = shell(card(empty('Yuklanmoqda…')));
  try { await load(); render(); } catch (e) { $('app').innerHTML = shell(card(`<p class="text-sm text-danger">${esc(e.message)}</p>`)); }
}

function loginScreen(err = '') {
  $('app').innerHTML = `<div class="min-h-screen flex items-center justify-center px-4"><form onsubmit="login(event)" class="w-full max-w-sm bg-surface border border-line rounded-2xl shadow-card p-6 space-y-4">
    <div><h1 class="text-xl font-bold">Sotuv auditi</h1><p class="text-xs text-muted mt-1">Admin akkaunti bilan kiring</p></div>
    <input id="lgEmail" type="email" required placeholder="Email" autocomplete="email" class="w-full h-11 px-3 rounded-xl bg-surface2 border border-line text-sm">
    <input id="lgPass" type="password" required placeholder="Parol" autocomplete="current-password" class="w-full h-11 px-3 rounded-xl bg-surface2 border border-line text-sm">
    ${err ? `<p class="text-xs text-danger">${esc(err)}</p>` : ''}
    <button class="w-full h-11 rounded-xl bg-fg text-surface text-sm font-semibold">Kirish</button></form></div>`;
}
async function login(e) {
  e.preventDefault();
  const { error } = await sbc.auth.signInWithPassword({ email: $('lgEmail').value.trim(), password: $('lgPass').value });
  if (error) return loginScreen(error.message);
  boot();
}
async function boot() {
  const { data } = await sbc.auth.getSession();
  if (!data.session) return loginScreen();
  const { data: ok } = await sbc.rpc('is_admin');
  if (!ok) { await sbc.auth.signOut(); return loginScreen('Bu akkaunt admin emas.'); }
  refresh();
}
boot();
</script>
