// Pages through results: the API returns at most 1000 rows per request.
// A failing view is retried once, then left empty with a warning, so one slow query never blanks the whole platform.
async function q(table, build = x => x) {
  for (let attempt = 0; ; attempt++) {
    const out = [];
    try {
      for (let from = 0; ; from += 1000) {
        const { data, error } = await build(sbc.from(table).select('*')).range(from, from + 999);
        if (error) throw new Error(error.message);
        out.push(...data);
        if (data.length < 1000) return out;
      }
    } catch (e) {
      if (attempt < 1) continue;
      S.warn.push(`${table}: ${e.message}`);
      return [];
    }
  }
}

const match = r => (!S.course || r.course === S.course) && (!S.branch || r.branch === S.branch);

function shell(body) {
  const d = S.data, title = (PAGES.find(p => p[0] === S.page) || [])[1] || '';
  const sources = ['', ...uniq([...(d.daily || []), ...(d.cohortSrc || [])].map(r => r.source))];
  const navItem = ([k, t, i]) => `<button onclick="S.page='${k}';S.menu=false;S.op=null;S.call=null;render();scrollTo(0,0)" class="nav-item ${S.page === k ? 'active' : ''} w-full flex items-center gap-2.5 px-3 h-9 rounded-lg text-[13px] font-medium text-muted hover:text-fg hover:bg-surface2 transition"><i class="ph-bold ${i} text-base"></i>${t}</button>`;
  const nav = NAV.map(([g, items]) => `${g ? `<div class="px-3 pt-4 pb-1.5 text-[10px] font-semibold tracking-[.14em] uppercase text-muted/70">${g}</div>` : '<div class="pt-4"></div>'}${items.map(navItem).join('')}`).join('');
  return `<div class="min-h-screen">
    <aside class="${S.menu ? 'flex' : 'hidden'} lg:flex fixed inset-y-0 left-0 z-30 w-60 flex-col bg-surface border-r border-line">
      <div class="px-5 h-16 flex items-center gap-2.5 border-b border-line"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:rgb(var(--accent) / .18)"><i class="ph-bold ph-chart-line-up text-accent"></i></div><div><div class="font-bold text-sm leading-tight">Sotuv auditi</div><div class="text-[11px] text-muted leading-tight">Robbit akademiyasi</div></div></div>
      <nav class="flex-1 overflow-y-auto px-3 pb-4">${nav}</nav>
      <div class="p-3 border-t border-line"><button onclick="sbc.auth.signOut().then(boot)" class="w-full flex items-center gap-2.5 px-3 h-9 rounded-lg text-[13px] text-muted hover:text-fg hover:bg-surface2"><i class="ph-bold ph-sign-out"></i>Chiqish</button></div>
    </aside>
    ${S.menu ? '<div class="fixed inset-0 z-20 bg-black/50 lg:hidden" onclick="S.menu=false;render()"></div>' : ''}
    <main class="lg:pl-60 min-w-0">
      <header class="sticky top-0 z-10 bg-bg/90 backdrop-blur border-b border-line">
        <div class="px-4 lg:px-8 h-16 flex items-center gap-3">
          <button onclick="S.menu=true;render()" class="lg:hidden h-9 w-9 rounded-lg bg-surface2" aria-label="Menyu"><i class="ph-bold ph-list"></i></button>
          <h1 class="text-lg font-bold truncate">${title}</h1>
          <div class="ml-auto flex items-center gap-2 text-sm">
            <button onclick="syncNow()" ${S.syncing ? 'disabled' : ''} class="h-9 px-3 rounded-xl bg-surface border border-line flex items-center gap-1.5" title="Bitrix, Meta va qo'ng'iroqlarni hozir yangilash"><i class="ph-bold ph-arrows-clockwise ${S.syncing ? 'animate-spin' : ''}"></i><span class="hidden sm:inline">${S.syncing ? 'Yangilanmoqda…' : 'Yangilash'}</span></button>
            <button onclick="toggleTheme()" class="h-9 w-9 rounded-full bg-surface border border-line" aria-label="Rang rejimi" title="Yorug' / qora"><i class="ph-bold ${document.documentElement.classList.contains('dark') ? 'ph-sun' : 'ph-moon'}"></i></button>
            ${S.page === 'settings' ? '' : calendar()}
            ${SOURCE_PAGES.includes(S.page) ? `<select onchange="S.source=this.value;render()" class="h-9 px-2 rounded-xl bg-surface border ${S.source ? 'border-accent text-accent' : 'border-line'}" aria-label="Manba">${sources.map(v => `<option value="${esc(v)}" ${v === S.source ? 'selected' : ''}>${v ? esc(v) : 'Barcha manbalar'}</option>`).join('')}</select>` : ''}
          </div>
        </div>
      </header>
      <div class="px-4 lg:px-8 py-6 max-w-[1400px]">${S.warn.length ? `<div class="mb-4 rounded-2xl border border-warn/40 bg-warn/10 text-[12.5px] p-3"><b>Ba'zi ma'lumotlar yuklanmadi</b> — «Yangilash»ni bosing. <span class="text-muted">${S.warn.map(esc).join(' · ')}</span></div>` : ''}${body}</div>
    </main>
  </div>`;
}
const SOURCE_PAGES = ['overview', 'cohort'];
const bySource = rows => rows.filter(r => !S.source || r.source === S.source);

const maxCpql = course => S.data.courses.find(c => c.course === course)?.max_cpql;

// Ring gauges (watch-style) for conversion shares.
const ring = (label, v, color) => { const r = 34, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, v || 0));
  return `<div class="flex flex-col items-center gap-2"><svg viewBox="0 0 84 84" class="w-[84px] h-[84px] -rotate-90"><circle cx="42" cy="42" r="${r}" fill="none" stroke="rgb(var(--c-${color}) / .18)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="rgb(var(--c-${color}))" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}"/></svg>
    <div class="-mt-[66px] mb-[30px] text-sm font-bold tabular-nums">${pct(v)}</div><div class="text-[11px] font-semibold uppercase tracking-wide" style="color:rgb(var(--c-${color}))">${label}</div></div>`; };
const rings = (items, title) => `<div class="bg-surface rounded-3xl p-5 mb-6"><div class="text-xs text-muted mb-4">${title}</div><div class="grid grid-cols-3 lg:grid-cols-6 gap-4">${items.map(([l, v, c]) => ring(l, v, c)).join('')}</div></div>`;
function overview() {
  const rows = bySource(S.data.daily);
  const t = groupSum(rows, () => 'all')[0];
  if (!t) return card(empty("Tanlangan davrda lead yo'q"));
  const kpi = (l, v, sub, color, hero) => `<div class="${hero ? 'hero' : 'bg-surface'} rounded-3xl p-5"><div class="text-[11px] font-semibold tracking-wide uppercase" style="color:rgb(var(--c-${color}))">${l}</div><div class="text-[28px] leading-tight font-bold mt-1 tabular-nums">${v}</div>${sub ? `<div class="text-[11px] text-muted mt-1">${sub}</div>` : ''}</div>`;
  const spend = S.data.spend.reduce((a, r) => a + +r.spend, 0), fx = +S.data.cfg?.fx_rate || 0;
  const paid = groupSum(S.data.daily.filter(r => r.source === 'Target'), () => 't')[0] || { leads: 0, qual: 0, won: 0, revenue: 0 };
  const metaLeads = S.data.spend.reduce((a, r) => a + +r.meta_leads, 0);
  // Sales closed in the period (any lead month) — what the sales team counts as "this month's sales".
  const won = bySource(S.data.wonDaily).reduce((a, r) => ({ n: a.n + +r.won, sum: a.sum + +r.amount }), { n: 0, sum: 0 });
  // A sale = deal now in To'lov qildi, Nabor guruh or Сделка успешна; show where they stand today.
  const wonStage = {}; for (const r of bySource(S.data.wonDaily)) wonStage[r.stage] = (wonStage[r.stage] || 0) + +r.won;
  const stageOrder = ["To'lov qildi", 'Nabor guruh', 'Сделка успешна'];
  const wonStages = Object.entries(wonStage).sort((a, b) => (stageOrder.indexOf(a[0]) + 1 || 9) - (stageOrder.indexOf(b[0]) + 1 || 9))
    .map(([k, n]) => `${esc(k)}: <b>${num(n)}</b>`).join(' · ');
  const wonTarget = S.data.wonDaily.filter(r => r.source === 'Target').reduce((a, r) => ({ n: a.n + +r.won, sum: a.sum + +r.amount }), { n: 0, sum: 0 });
  const romi = fx && spend ? div(wonTarget.sum - spend * fx, spend * fx) : null;
  const adKpis = spend ? `<div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">
      ${kpi('Reklama xarajati', adMoney(spend), `Meta · ${num(metaLeads)} natija (Results)`, 'amber')}
      ${kpi('Lead narxi', adMoney(div(spend, paid.leads)), `Target: ${num(paid.leads)} lead Bitrix'da`, 'blue')}
      ${kpi('CPQL', adMoney(div(spend, paid.qual)), `sifatli lead narxi · ${num(paid.qual)} ta`, 'teal')}
      ${kpi('Sotuv narxi', adMoney(div(spend, won.n)), `${adMoney(spend, false)} ÷ ${num(won.n)} ta sotuv (shu davrda «To'lov qildi» / «Nabor guruh» / «Успешна»ga o'tgan, barcha manbalar)`, 'green')}
      ${kpi('ROMI', pct(romi), fx ? `tushum ${moneyShortTop(wonTarget.sum)} so'm · kurs ${num(fx)}` : 'kurs yo\'q', 'violet')}
    </div>` : '';
  const days = Math.round((new Date(S.to) - new Date(S.from)) / 864e5) + 1;
  return `<div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">
      ${kpi('Jami leadlar', num(t.leads), `${fmtDay(S.from)}${S.from !== S.to ? ' — ' + fmtDay(S.to) : ''} · kuniga ~${num(t.leads / days)}`, 'violet', true)}
      ${kpi('Sifatli', num(t.qual), pct(div(t.qual, t.leads)) + ' leaddan', 'teal')}
      ${kpi('Sotuv', num(won.n), `${wonStages ? wonStages + '<br>' : ''}shu davrda sotuvga o'tgan · ${num(t.won)} tasi shu davr leadlaridan`, 'green')}
      ${kpi('Jarayonda', num(t.in_progress), 'hali hal bo\'lmagan', 'amber')}
      ${kpi('Sifatsiz', num(t.junk), pct(div(t.junk, t.leads)) + ' leaddan', 'crimson')}
    </div>` +
    rings([['Aloqa', div(t.contacted, t.leads), 'blue'], ['Sifatli', div(t.qual, t.leads), 'teal'], ['Deal', div(t.deals, t.leads), 'violet'], ['Filialga keldi', div(t.came_to_branch, t.leads), 'amber'], ['Sotuv', div(t.won, t.leads), 'green'], ['Sifatsiz', div(t.junk, t.leads), 'rose']], 'Jami leadlardan qanchasi qayergacha borgan') +
    (spend ? adKpis : `<div class="mb-6 text-xs text-muted">Tanlangan davrda reklama xarajati yo'q.</div>`) +
    card(h3(S.source ? `Manba: ${esc(S.source)}` : 'Manbalar', "Tanlangan davrdagi leadlar va ular qayergacha borgani") + outcomeTable('Manba', groupSum(rows, r => r.source).sort((a, b) => b.leads - a.leads), r => `<button onclick="S.source='${esc(r.key).replace(/'/g, "\\'")}';render()" class="font-semibold hover:text-accent text-left">${esc(r.key)}</button>`));
}

// Sales counted by the month they happened, split by the month the lead came in.
function salesByMonth(list) {
  const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
  const by = {};
  for (const o of list) for (const k of [0, 1, 2, 3]) {
    const n = o.m[k] || 0; if (!n) continue;
    const key = iso(new Date(+o.month.slice(0, 4), +o.month.slice(5, 7) - 1 + k, 1)).slice(0, 7);
    const r = by[key] ??= { key, total: 0, k: [0, 0, 0, 0] }; r.total += n; r.k[k] += n;
  }
  const rows = Object.values(by).sort((a, b) => b.key.localeCompare(a.key)), mx = Math.max(1, ...rows.map(r => r.total));
  const part = (r, k) => r.k[k] ? `${num(r.k[k])} <span class="text-xs text-muted">${pct(div(r.k[k], r.total))}</span>` : '<span class="text-muted">0</span>';
  return card(h3("Oy bo'yicha jami sotuvlar", "Sotuv bo'lgan oy bo'yicha: shu oydagi barcha sotuvlar va ular qaysi oy leadlaridan kelgani. Masalan, oktyabr sotuvlarining bir qismi — sentyabr leadlari.") + table([
    { t: 'Sotuv oyi', s: r => r.key, f: r => `<b>${MONTHS[+r.key.slice(5, 7) - 1]} ${r.key.slice(0, 4)}</b>` },
    { t: 'Jami sotuv', r: 1, s: r => r.total, f: r => bar(r.total, mx, 'green') },
    { t: "Shu oy leadlaridan", r: 1, s: r => r.k[0], f: r => part(r, 0) },
    { t: "O'tgan oy leadlaridan", r: 1, s: r => r.k[1], f: r => part(r, 1) },
    { t: '2 oy oldingi leadlardan', r: 1, s: r => r.k[2], f: r => part(r, 2) },
    { t: '3+ oy oldingi', r: 1, s: r => r.k[3], f: r => part(r, 3) },
  ], rows), 'mb-6');
}

// Sales kanban: one column per sale month; cards per source show which lead month each sale came from.
const AGE = [[0, 'Shu oy leadlari', 'green'], [1, "O'tgan oy leadlari", 'amber'], [2, '2 oy oldingi', 'teal'], [3, 'Eski leadlar', 'violet'], [-1, 'Leadsiz', 'crimson']];
function salesKanban(cohortList) {
  const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
  const rows = bySource(S.data.salesMonth);
  // Months touched by the selected dates (latest 3 when the range has no sales).
  const all = [...new Set(rows.map(r => r.sale_month))].sort().reverse(), inRange = all.filter(m => m.slice(0, 7) >= S.from.slice(0, 7) && m.slice(0, 7) <= S.to.slice(0, 7));
  const months = (inRange.length ? inRange : all).slice(0, 6);
  if (!months.length) return card(empty("Sotuv yo'q"));
  // Leads of a month not decided inside it (sold later or still open) — carried into the next month.
  const carried = m => { const o = cohortList.find(x => x.month === m); return o ? o.still_open + o.won_later : null; };
  const seg = (by, total) => `<div class="flex h-2 rounded-full overflow-hidden bg-surface2">${AGE.map(([a, , c]) => by[a] ? `<div style="width:${(by[a] / total * 100).toFixed(1)}%;background:rgb(var(--c-${c}))"></div>` : '').join('')}</div>`;
  const col = m => {
    const mine = rows.filter(r => r.sale_month === m), won = mine.filter(r => r.kind === 'won'), paid = mine.filter(r => r.kind === 'paid');
    const total = won.reduce((a, r) => a + +r.sales, 0), paidN = paid.reduce((a, r) => a + +r.sales, 0);
    const byAge = {}; for (const r of won) byAge[r.age] = (byAge[r.age] || 0) + +r.sales;
    const src = {}; for (const r of won) { const o = src[r.source] ??= { n: 0, by: {} }; o.n += +r.sales; o.by[r.age] = (o.by[r.age] || 0) + +r.sales; }
    const cards = Object.entries(src).sort((a, b) => b[1].n - a[1].n).map(([name, o]) => `<div class="rounded-2xl bg-surface2 p-3.5">
        <div class="flex items-baseline justify-between gap-2"><span class="text-[13px] font-semibold truncate">${esc(name)}</span><span class="text-lg font-bold tabular-nums">${num(o.n)}</span></div>
        <div class="mt-2">${seg(o.by, o.n)}</div>
        <div class="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-muted">${AGE.filter(([a]) => o.by[a]).map(([a, l, c]) => `<span><b class="tabular-nums" style="color:rgb(var(--c-${c}))">${o.by[a]}</b> ${l.toLowerCase()}</span>`).join('')}</div></div>`).join('');
    const cr = carried(m), cur = m.slice(0, 7) === new Date().toISOString().slice(0, 7);
    return `<div class="min-w-[280px] flex-1 rounded-3xl bg-surface p-4 flex flex-col gap-3">
      <div class="flex items-center justify-between"><span class="font-semibold">${MONTHS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}</span>${cur ? '<span class="text-[11px] px-2 py-0.5 rounded-full bg-accent/15 text-accent">joriy oy</span>' : ''}</div>
      <div><div class="text-4xl font-bold tabular-nums">${num(total)}</div><div class="text-xs text-muted">sotuv («Сделка успешна»)${paidN ? ` · yana <b class="text-fg">${paidN}</b> ta «To'lov qildi», hali yopilmagan` : ''}</div></div>
      ${seg(byAge, total)}
      <div class="grid grid-cols-2 gap-2">${AGE.filter(([a]) => byAge[a]).map(([a, l, c]) => `<div class="rounded-xl px-3 py-2" style="background:rgb(var(--c-${c}) / .12)"><div class="text-lg font-bold tabular-nums" style="color:rgb(var(--c-${c}))">${byAge[a]}</div><div class="text-[11px] text-muted">${l}</div></div>`).join('')}</div>
      ${cr != null ? `<div class="rounded-xl border border-dashed border-line px-3 py-2 text-xs text-muted">→ Keyingi oyga o'tdi: <b class="text-fg tabular-nums">${num(cr)}</b> ta lead${cur ? ' (oy hali tugamagan)' : ''}</div>` : ''}
      <div class="text-[11px] uppercase tracking-wide text-muted mt-1">Manbalar bo'yicha</div>
      <div class="flex flex-col gap-2">${cards}</div></div>`;
  };
  return card(h3(`Oy bo'yicha sotuvlar${S.source ? ' — ' + esc(S.source) : ''}`, "Har ustun — sotuv bo'lgan oy. Raqamlar sotuv qaysi oy leadidan kelganini ko'rsatadi. «Eski leadlar» — 2 oydan oldingi yoki platformaga yuklanmagan leadlar (iyuldan oldin).") +
    `<div class="flex gap-4 overflow-x-auto pb-2 -mx-1 px-1">${months.map(col).join('')}</div>`);
}
function cohort() {
  const by = {};
  for (const r of bySource(S.data.cohortSrc)) {
    const o = by[r.lead_month] ??= { month: r.lead_month, leads: 0, won: 0, still_open: 0, m: {} };
    o.leads += +r.leads; o.won += +r.won; o.still_open += +r.still_open;
    [0, 1, 2, 3].forEach(k => { o.m[k] = (o.m[k] || 0) + +r['m' + k]; });
  }
  const list = Object.values(by).filter(o => o.month >= '2026-07-01' && o.month.slice(0, 7) <= S.to.slice(0, 7)).map(o => ({ ...o, won_same_month: o.m[0], won_later: o.m[1] + o.m[2] + o.m[3] })).sort((a, b) => b.month.localeCompare(a.month));
  if (!list.length) return card(empty("Ma'lumot yo'q"));
  const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
  const name = m => MONTHS[+m.slice(5, 7) - 1], nextName = (m, k) => MONTHS[(+m.slice(5, 7) - 1 + k) % 12];
  const COLORS = ['green', 'teal', 'blue', 'violet'];
  const maxM = Math.max(1, ...list.flatMap(o => [0, 1, 2, 3].map(k => o.m[k] || 0)));
  const carried = o => o.still_open + o.won_later;
  const mx = f => Math.max(1, ...list.map(f));
  const cell = (o, k) => { const n = o.m[k] || 0, future = new Date(+o.month.slice(0, 4), +o.month.slice(5, 7) - 1 + k, 1) > new Date();
    if (future) return `<td class="p-1"><div class="h-16 rounded-xl border border-dashed border-line flex items-center justify-center text-[11px] text-muted">hali kelmadi</div></td>`;
    const c = COLORS[k];
    return `<td class="p-1"><div class="h-16 rounded-xl bg-surface2 border border-line px-2 py-1.5 flex flex-col justify-between"><div class="flex items-baseline justify-between gap-1"><span class="text-lg font-bold tabular-nums" style="color:rgb(var(--c-${c}))">${n}</span><span class="text-[10px] text-muted">${nextName(o.month, k)}</span></div><div class="text-[10px] text-muted">sotildi · ${pct(div(n, o.leads))}</div><div class="h-1 rounded-full bg-line"><div class="h-1 rounded-full" style="width:${(n / maxM * 100).toFixed(0)}%;background:rgb(var(--c-${c}))"></div></div></div></td>`; };
  const split = o => [0, 1, 2, 3].filter(k => o.m[k]).map(k => `<span style="color:rgb(var(--c-${COLORS[k]}))">${o.m[k]}</span> ${nextName(o.month, k).toLowerCase()}da`).join(' + ');
  const th = (t, tip) => `<th class="px-2 font-semibold" title="${tip}">${t}</th>`;
  return salesKanban(list) + `<details class="mt-6"><summary class="cursor-pointer text-sm text-muted hover:text-fg mb-3">Batafsil: har oy leadlari keyin qachon sotib olgan</summary>` + card(h3(`Leadlar qachon sotuvga aylanadi${S.source ? ' — ' + esc(S.source) : ''}`, "Har qator — bir oyda kelgan leadlar. <b>Shu oyda sotildi</b> — o'sha oyning o'zida sotib olganlar. <b>Keyingi oyga o'tdi</b> — o'sha oyda sotilmagan va yopilmagan leadlar (keyingi oylarda sotilganlar + hali jarayondagilar). <b>Keyingi oylarda sotildi</b> — o'sha leadlardan keyingi oylarda sotib olganlar. <b>Jami sotuv</b> = shu oyda + keyingi oylarda.") +
    `<div class="overflow-x-auto -mx-2"><table class="w-full text-sm border-separate" style="border-spacing:0"><thead><tr class="text-xs text-muted align-bottom">
      <th class="text-left px-2 py-2 font-semibold">Lead kelgan oy</th><th class="text-right px-2 font-semibold">Leadlar</th>${th('Shu oyda sotildi', "Lead kelgan oyning o'zida sotib olganlar")}${th("Keyingi oyga o'tdi", "Oy oxirigacha sotilmagan va yopilmagan leadlar")}${th('Keyingi oylarda sotildi', "Shu oy leadlaridan keyingi oylarda sotib olganlar")}${th('Jami sotuv', "Shu oyda + keyingi oylarda")}
      <th class="px-2 font-semibold">Shu oyning o'zida</th><th class="px-2 font-semibold">1 oydan keyin</th><th class="px-2 font-semibold">2 oydan keyin</th><th class="px-2 font-semibold">3+ oydan keyin</th></tr></thead>
      <tbody>${list.map(o => `<tr><td class="px-2 py-1 font-semibold whitespace-nowrap">${name(o.month)} ${o.month.slice(0, 4)}</td><td class="px-2 text-right tabular-nums">${num(o.leads)}</td>
        <td class="px-2">${bar(o.won_same_month, mx(x => x.won_same_month), 'green')}</td><td class="px-2">${bar(carried(o), mx(carried), 'amber')}</td>
        <td class="px-2">${bar(o.won_later, mx(x => x.won_later), 'teal')}</td><td class="px-2">${bar(o.won, mx(x => x.won), 'green', `${o.won} · ${pct(div(o.won, o.leads))}`)}</td>
        ${[0, 1, 2, 3].map(k => cell(o, k)).join('')}</tr>
        <tr><td></td><td colspan="9" class="px-2 pb-3 text-[11px] text-muted">Jami ${o.won} ta sotuv = ${split(o) || '0'}. Keyingi oyga o'tgan ${num(carried(o))} tadan ${o.won_later} tasi keyin sotib oldi, ${num(o.still_open)} tasi hali jarayonda.</td></tr>`).join('')}</tbody></table></div>` +
    `<p class="text-xs text-muted mt-2">«Sotuv» — Bitrix'da «Сделка успешна» bo'lgan deal. Iyuldan oldingi oylar to'liq yuklanmagan.</p>`) + '</details>';
}

function creatives() {

  if (A.status !== 'all') rows = rows.filter(o => A.status === 'active' ? o.active : !o.active);
  if (A.q) { const t = A.q.toLowerCase(); rows = rows.filter(o => [o.name, o.adset, o.campaign].some(x => String(x || '').toLowerCase().includes(t))); }
  if (!S.sort[CREATIVE_KEY]) rows.sort((a, b) => b.spend - a.spend);

  const m = o => ({ ctr: div(o.clicks, o.impr), cpc: div(o.spend, o.clicks), cpm: o.impr ? o.spend / o.impr * 1000 : null, cpl: div(o.spend, o.mleads), cpql: div(o.spend, o.qual), cps: div(o.spend, o.won), roas: fx && o.spend ? o.revenue / (o.spend * fx) : null });

  const seg = (items, cur, set) => `<div class="inline-flex p-1 bg-surface2 rounded-xl text-xs font-semibold">${items.map(([k, t]) => `<button onclick="${set.replace('$', k)}" class="px-3 h-7 rounded-lg ${cur === k ? 'bg-surface shadow-sm text-fg' : 'text-muted hover:text-fg'}">${t}</button>`).join('')}</div>`;
  const usd = n => adMoney(n, false);
  const cols = [
    { t: A.level === 'ad' ? "E'lon" : A.level === 'adset' ? 'Adset' : 'Kampaniya', s: o => o.name, f: o => o._foot ? '<b>Jami</b>' : `<div class="flex items-center gap-3">${A.level === 'ad' ? (o.thumb ? `<img src="${esc(o.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" class="w-12 h-12 rounded-lg object-cover bg-surface2 shrink-0" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'w-12 h-12 rounded-lg bg-surface2 shrink-0'}))">` : '<div class="w-12 h-12 rounded-lg bg-surface2 shrink-0 grid place-items-center text-muted"><i class="ph ph-image"></i></div>') : ''}<div class="max-w-[260px] min-w-0"><div class="font-semibold truncate" title="${esc(o.name)}">${esc(o.name)}</div><div class="text-[11px] text-muted truncate">${o.active ? '<span style="color:rgb(var(--c-green))">● Faol</span>' : "<span>○ To'xtagan</span>"}${A.level === 'ad' ? ' · ' + esc(o.adset || '') : ''}</div></div></div>` },
    { t: 'Xarajat', r: 1, s: o => o.spend, f: o => usd(o.spend) },

    { t: 'CTR', r: 1, s: o => m(o).ctr ?? -1, f: o => pct(m(o).ctr) },
    { t: 'CPC', r: 1, s: o => m(o).cpc ?? 1e9, f: o => usd(m(o).cpc) },
    { t: 'CPM', r: 1, s: o => m(o).cpm ?? 1e9, f: o => usd(m(o).cpm) },
    { t: 'Natija (Meta)', r: 1, s: o => o.mleads, f: o => num(o.mleads) },
    { t: 'CPL', r: 1, s: o => m(o).cpl ?? 1e9, f: o => usd(m(o).cpl) },
    { t: 'Lead (Bitrix)', r: 1, s: o => o.leads, f: o => num(o.leads) },
    { t: 'Sifatli', r: 1, s: o => o.qual, f: o => `${num(o.qual)} <span class="text-[11px] text-muted">${pct(div(o.qual, o.leads))}</span>` },
    { t: 'CPQL', r: 1, s: o => m(o).cpql ?? 1e9, f: o => o._foot || m(o).cpql == null ? usd(m(o).cpql) : chip(usd(m(o).cpql), m(o).cpql <= avgCpql ? 'success' : 'danger') },
    { t: 'Sotuv', r: 1, s: o => o.won, f: o => num(o.won) },

  const more = rows.length > A.limit ? `<div class="mt-4 flex items-center gap-3"><button onclick="S.ad.limit+=20;render()" class="h-9 px-4 rounded-xl bg-surface2 text-sm font-semibold">Yana 20 ta</button><span class="text-xs text-muted">${A.limit} / ${rows.length} ko'rsatildi</span></div>` : '';
  return card(`<div class="flex flex-wrap items-center gap-3 mb-4">
      ${seg([['active', `Faol ${counts.active}`], ['paused', `To'xtagan ${counts.paused}`], ['all', `Hammasi ${counts.all}`]], A.status, "S.ad.status='$';S.ad.limit=20;render()")}
      ${seg([['ad', "E'lonlar"], ['adset', 'Adsetlar'], ['campaign', 'Kampaniyalar']], A.level, "S.ad.level='$';S.ad.limit=20;render()")}
      <input value="${esc(A.q)}" placeholder="Qidirish…" onchange="S.ad.q=this.value;S.ad.limit=20;render()" class="h-9 px-3 rounded-xl bg-surface2 border border-line text-sm w-full sm:w-56 ml-auto">
    </div>` + h3('Kreativlar samaradorligi', `CTR = klik / ko'rish · CPC = klik narxi · CPM = 1000 ko'rish narxi · CPL = Meta natija narxi · CPQL = sifatli lead narxi (o'rtachadan arzon — sariq) · ROAS = tushum / xarajat. Ustun nomini bosing — saralanadi.`) +

}
const CREATIVE_KEY = "E'lon|Xarajat|Ko'rishlar|CTR|CPC|CPM|Lead (Meta)|CPL|Lead (Bitrix)|Sifatli|CPQL|Sotuv|Sotuv narxi|ROAS";

// Objections heard in analysed calls of the selected dates, with how often such calls still ended booked.
function callObjections() {
  const ok = analysed(), by = {};
  for (const c of ok) for (const o of new Set((c.objections || []).map(x => x.toLowerCase().trim()))) { const r = by[o] ??= { o, n: 0, booked: 0 }; r.n++; r.booked += c.outcome === 'yozildi'; }
  const rows = Object.values(by).sort((a, b) => b.n - a.n).slice(0, 12);
  if (!rows.length) return '';
  return card(h3("Qo'ng'iroqlardagi e'tirozlar", `${num(ok.length)} ta tahlil qilingan qo'ng'iroqdan (tanlangan davr). «Yozildi» — e'tirozga qaramay sinov darsiga yozilganlar ulushi`) + table([
    { t: "E'tiroz", f: r => esc(r.o) }, { t: "Qo'ng'iroq", r: 1, f: r => bar(r.n, rows[0].n, 'rose', num(r.n)) }, { t: 'Yozildi', r: 1, f: r => pct(r.booked / r.n) },
  ], rows), 'mb-6');
}
function pains() {
  const d = S.data;

  const by = {}, withPains = analysed().filter(c => (c.pains || []).length);
  for (const c of withPains) for (const p of new Set(c.pains.map(x => x.toLowerCase().trim()))) { const o = by[p] ??= { p, n: 0, booked: 0 }; o.n++; o.booked += c.outcome === 'yozildi'; }
  const list = Object.values(by).sort((a, b) => b.n - a.n);
  const obj = d.objections.filter(match);
  const objBy = {}; for (const r of obj) objBy[r.objection] = (objBy[r.objection] || 0) + +r.lost_deals;
  const lost = Object.values(objBy).reduce((a, b) => a + b, 0), price = objBy.price || 0;
  const known = lost - (objBy.unknown || 0);
  const verdict = known < 10 ? chip("Hukm uchun tahlil qilingan qo'ng'iroq kam (<10)") : div(price, known) >= 0.4 ? chip('Narxga sezgir — narx/to\'lov taklifi', 'warn') : chip("Og'riqqa asoslangan taklif", 'success');
  const OBJ = { price: 'Narx', time: 'Vaqt', trust: 'Ishonch', think_later: "O'ylab ko'raman", consult_family: 'Oila bilan maslahat', competitor: 'Raqobatchi', none: "Yo'q", unknown: "Tahlil qilinmagan" };
  return callObjections() + leadReasons() + `<div class="grid lg:grid-cols-3 gap-6">
    ${card(h3("Top og'riqlar", `Ota-ona nega farzandini kursga bermoqchi — ${num(withPains.length)} ta tahlil qilingan qo'ng'iroqdan. «Yozildi» — shu og'riq aytilgan qo'ng'iroqlardan sinov darsiga yozilganlar ulushi. Reklama matni uchun eng kuchli og'riqlarni oling.`) + (list.length ? table([
      { t: "Og'riq", f: o => esc(o.p) }, { t: "Qo'ng'iroq", r: 1, s: o => o.n, f: o => bar(o.n, list[0].n, 'violet', num(o.n)) }, { t: 'Yozildi', r: 1, s: o => div(o.booked, o.n), f: o => pct(div(o.booked, o.n)) },
    ], list.slice(0, 12)) : empty("AI qo'ng'iroqlardan og'riqlarni yig'moqda: har yangi tahlil bilan bu ro'yxat to'ladi.")), 'lg:col-span-2')}
    ${card(h3("E'tirozlar", "Yo'qotilgan deallar") + `<div class="mb-4">${verdict}</div>` + (lost ? `<div class="space-y-2">${Object.entries(objBy).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="text-sm"><div class="flex justify-between"><span>${OBJ[k] || esc(k)}</span><span class="tabular-nums text-muted">${n}</span></div><div class="h-1.5 bg-surface2 rounded-full mt-1"><div class="h-1.5 bg-accent rounded-full" style="width:${(n / lost * 100).toFixed(0)}%"></div></div></div>`).join('')}</div>` : empty("Yo'qotilgan deal yo'q")))}
  </div>`;
}

// Lead loss reasons from Bitrix statuses: CRM-side objections, available without call analysis.
function leadReasons() {
  const d = S.data, outBy = {}; let outAll = 0;
  for (const r of d.outcomes.filter(match)) { outAll += +r.leads; (outBy[r.status_name] ??= { name: r.status_name, outcome: r.outcome, n: 0 }).n += +r.leads; }
  const outList = Object.values(outBy).sort((a, b) => b.n - a.n);
  const OUT_TONE = { qual: 'success', lost: 'danger', open: 'info' }, OUT_LBL = { qual: 'sifatli', lost: "yo'qotilgan", open: 'jarayonda' };
  const reasons = card(h3("Leadlar natijasi (Bitrix stadiyalari)", `${num(outAll)} ta lead, tanlangan davr. Yo'qotish sabablari menejer belgilagan stadiyadan.`) +
    (outList.length ? `<div class="space-y-2.5">${outList.map(o => `<div class="text-sm"><div class="flex justify-between gap-3"><span class="min-w-0 truncate">${esc(o.name)} ${chip(OUT_LBL[o.outcome], OUT_TONE[o.outcome])}</span><span class="tabular-nums text-muted whitespace-nowrap">${num(o.n)} · ${pct(div(o.n, outAll))}</span></div><div class="h-1.5 bg-surface2 rounded-full mt-1"><div class="h-1.5 rounded-full ${o.outcome === 'qual' ? 'bg-success' : o.outcome === 'lost' ? 'bg-danger/70' : 'bg-info/70'}" style="width:${(o.n / outList[0].n * 100).toFixed(0)}%"></div></div></div>`).join('')}</div>` : empty("Lead yo'q")), 'mb-6');
  return reasons;
}

// All leads, stage by stage: lead statuses, then deal stages (C47 pipeline).
const STEPS = [['leads', 'Leadlar'], ['contacted', 'Aloqa qilindi'], ['qual', 'Sifatli'], ['deals', 'Deal ochildi'], ['came_to_branch', 'Filialga keldi'], ['won', 'Sotuv']];
// What each funnel step counts (shown under the step name).
const STEP_INFO = {
  leads: "Bitrix'ga tushgan barcha leadlar",
  contacted: "Gaplashilgan: status yangi, propushniy yoki «bog'lanib bo'lmadi» emas",
  qual: "Status «Качественный лид»",
  deals: "Leaddan sdelka ochilgan",
  came_to_branch: "Sdelka «Filialga keldi» yoki undan keyingi bosqichda",
  won: "Shu davr leadlaridan sotuvga aylanganlar (sdelka hozir «To'lov qildi», «Nabor guruh» yoki «Сделка успешна»da)",
};
function sumBy(rows, keyFn) {
  const by = {};
  for (const r of rows) {
    const k = keyFn(r); if (k == null) continue;
    const o = by[k] ??= { key: k, revenue: 0, deal_lost: 0, ...Object.fromEntries(STEPS.map(([s]) => [s, 0])) };
    for (const [s] of STEPS) o[s] += +r[s];
    o.revenue += +r.revenue; o.deal_lost += +r.deal_lost;
  }
  return Object.values(by);
}
const stepCell = (o, i) => { const v = o[STEPS[i][0]], prev = i ? o[STEPS[i - 1][0]] : null; return `${num(v)}${i ? `<div class="text-[10px] text-muted">${pct(div(v, prev))}</div>` : ''}`; };
// Why the funnel's Sotuv differs from the «Umumiy» Sotuv card: the funnel follows this period's leads,
// the card counts every deal that became a sale in this period, whenever its lead came in.
function wonGap(cohort) {
  const all = bySource(S.data.wonDaily).reduce((a, r) => a + +r.won, 0), older = all - cohort;
  if (older <= 0) return '';
  return `<div class="mt-4 p-3 rounded-xl bg-surface2 text-[13px] leading-relaxed"><i class="ph-bold ph-info text-muted"></i> Voronkadagi <b>${num(cohort)} ta sotuv</b> — faqat shu davrda kelgan leadlardan. «Umumiy»dagi <b>Sotuv ${num(all)}</b> esa shu davrda sotuvga o'tgan barcha deallar: ulardan <b>${num(older)} tasi</b> oldinroq (o'tgan oylarda) kelgan leadlar, ular bu voronkaga kirmaydi.</div>`;
}
function funnel() {
  const rows = S.data.sales.filter(match);
  const [t] = sumBy(rows, () => 'all');
  if (!t) return card(empty("Lead yo'q"));
  // Widths follow the square root of the share so the small bottom steps stay readable; exact numbers are printed.
  const COLORS = ['blue', 'violet', 'teal', 'violet', 'amber', 'green'];
  const bars = STEPS.map(([s, l], i) => {
    const v = t[s], prev = i ? t[STEPS[i - 1][0]] : v, conv = div(v, prev), weak = i && conv != null && conv < 0.5, share = div(v, t.leads) || 0;
    const w = Math.max(Math.sqrt(share) * 100, 14).toFixed(1);

    return step + `<div class="grid grid-cols-[minmax(0,1fr)_minmax(0,2fr)_minmax(0,1fr)] items-center gap-3 sm:gap-5">
      <div class="min-w-0"><div class="text-sm font-semibold">${l}</div><div class="text-[11px] text-muted leading-snug">${STEP_INFO[s]}</div></div>
      <div class="flex justify-center"><div class="h-11 rounded-xl flex items-center justify-center text-white font-bold tabular-nums text-[15px] shadow-sm" style="width:${w}%;background:linear-gradient(90deg, rgb(var(--c-${COLORS[i]}) / .85), rgb(var(--c-${COLORS[i]})))">${num(v)}</div></div>
      <div class="text-right"><div class="text-sm font-semibold tabular-nums">${pct(share)}</div><div class="text-[11px] text-muted">jami leaddan</div></div></div>`;
  }).join('');
  const cols = name => [{ t: name, f: o => `<span class="font-semibold">${esc(o.key)}</span>` }, ...STEPS.map(([, l], i) => ({ t: l, r: 1, f: o => stepCell(o, i) })),
    { t: 'Lead→sotuv', r: 1, s: o => div(o.won, o.leads) ?? -1, f: o => chip(pct(div(o.won, o.leads)), div(o.won, o.leads) >= div(t.won, t.leads) ? 'success' : 'danger') }, { t: 'Tushum', r: 1, f: o => money(o.revenue) }];
  const byOp = sumBy(rows, r => r.operator || "Mas'ul yo'q").filter(o => o.leads >= 20).sort((a, b) => b.leads - a.leads);
  const dealCols = name => [{ t: name, f: o => `<span class="font-semibold">${esc(o.key)}</span>` }, ...STEPS.slice(3).map(([, l], j) => ({ t: l, r: 1, f: o => stepCell(o, j + 3) })),
    { t: "Deal yo'qotildi", r: 1, f: o => num(o.deal_lost) }, { t: 'Deal→sotuv', r: 1, s: o => div(o.won, o.deals) ?? -1, f: o => pct(div(o.won, o.deals)) }, { t: 'Tushum', r: 1, f: o => money(o.revenue) }];
  const byBranch = sumBy(rows.filter(r => r.deal_manager_id), r => r.deal_branch || 'Filial belgilanmagan').sort((a, b) => b.deals - a.deals);
  const byMgr = sumBy(rows.filter(r => r.deal_manager_id), r => r.deal_manager).filter(o => o.deals >= 5).sort((a, b) => b.won - a.won);
  return card(h3('Umumiy voronka', `Tanlangan davrda (${fmtDay(S.from)}${S.from !== S.to ? ' — ' + fmtDay(S.to) : ''}) kelgan barcha leadlar. Bosqichlar orasidagi raqam — oldingi bosqichdan o'tganlar ulushi, 50% dan past bo'lsa qizil.`) + `<div>${bars}</div>` + wonGap(t.won), 'mb-6') +
    stageCards() +
    card(h3("Lead stadiyasi bo'yicha konversiya", "Hozir shu stadiyada turgan leadlar: ulardan nechtasi sotuvga aylangan, jarayonda, deal yopilgan yoki sifatsiz.") + outcomeTable('Stadiya', groupSum(S.data.statusOut, r => r.status_name).map(o => ({ ...o, sort: Math.min(...S.data.statusOut.filter(r => r.status_name === o.key).map(r => r.sort)) })).sort((a, b) => a.sort - b.sort), r => `<span class="font-semibold">${esc(r.key)}</span>`), 'mb-6') +
    card(h3("Operatorlar (kim gaplashgan)", "Lead egasi (call-markaz). Ustun nomini bosing — eng yuqori/past konversiya.") + outcomeTable('Operator', groupSum(S.data.operators, r => r.operator).filter(o => o.leads >= 20).sort((a, b) => b.leads - a.leads), r => `<span class="font-semibold">${esc(r.key)}</span>`), 'mb-6') +
    card(h3('Filiallar', "Deal egasi ismidagi filial nomidan (masalan «|| Xadra»).") + table(dealCols('Filial'), byBranch), 'mb-6') +
    card(h3('Filial menejerlari', 'Kamida 5 ta deal') + table(dealCols('Menejer'), byMgr), 'mb-6') +
    leadReasons() +
    `<p class="text-xs text-muted">Yo'qotilgan deal qaysi bosqichda yopilgani Bitrix'da saqlanmaydi, shuning uchun u faqat «Deal ochildi»da hisoblanadi.</p>`;
}

// Every Bitrix stage (lead statuses and C47 deal stages) in kanban order.
const stageRow = (name, n, total, extra = '', tone = 'violet') => `<div class="text-sm"><div class="flex justify-between gap-3"><span class="min-w-0 truncate">${esc(name)}</span><span class="tabular-nums whitespace-nowrap">${num(n)} <span class="text-xs text-muted">· ${pct(div(n, total))}${extra}</span></span></div><div class="h-1.5 bg-surface2 rounded-full mt-1"><div class="h-1.5 rounded-full" style="width:${Math.max(div(n, total) * 100, 0.5).toFixed(1)}%;background:rgb(var(--c-${tone}) / .7)"></div></div></div>`;
function stageCards() {
  const d = S.data, by = {}; let all = 0;

  const leadTable = table([
    { t: 'Stadiya', s: o => o.sort ?? -1, f: o => o.total ? '<b>Jami leadlar</b>' : `<span class="inline-flex items-center gap-2"><i class="w-2 h-2 rounded-full" style="background:rgb(var(--c-${TONE_BAR[o.outcome]}))"></i>${esc(o.name)}</span>` },
    { t: 'Turi', f: o => o.total ? '' : `<span class="text-xs text-muted">${LBL[o.outcome]}</span>` },
    { t: 'Hozir shu yerda', r: 1, s: o => o.n, f: o => o.total ? `<b>${num(o.n)}</b>` : bar(o.n, maxN, TONE_BAR[o.outcome]) },
    { t: 'Jamidan %', r: 1, s: o => div(o.n, all), f: o => pct(div(o.n, all)) },
    { t: "Kamida shu yergacha kelgan", r: 1, s: o => o.total ? all : passed(o) ?? -1, f: o => o.total ? num(all) : passed(o) == null ? '<span class="text-muted">—</span>' : num(passed(o)) },
    { t: 'Shundan, jamidan %', r: 1, s: o => o.total ? 1 : div(passed(o), all) ?? -1, f: o => o.total ? '100%' : passed(o) == null ? '' : pct(div(passed(o), all)) },
  ], leadRows);
  const ds = {}; let dAll = 0;
  for (const r of d.dealStages) { dAll += +r.deals; (ds[r.stage] ??= { name: r.stage_name, sort: r.sort, stage: r.stage, n: 0 }).n += +r.deals; }
  const dl = Object.values(ds).sort((a, b) => a.sort - b.sort), isLost = x => /LOSE$/.test(x.stage);
  // Reached = deals now at this stage or later (lost deals excluded: their last stage is unknown).
  const reached = x => isLost(x) ? null : dl.filter(y => !isLost(y) && y.sort >= x.sort).reduce((a, y) => a + y.n, 0);
  const open = dl.filter(x => !isLost(x)), prevOf = x => open[open.indexOf(x) - 1];
  const maxD = Math.max(1, ...dl.map(o => o.n));
  const dealTable = table([
    { t: 'Deal stadiyasi', s: o => o.sort, f: o => o.total ? '<b>Jami deallar</b>' : esc(o.name) },
    { t: 'Hozir shu yerda', r: 1, s: o => o.n, f: o => o.total ? `<b>${num(o.n)}</b>` : bar(o.n, maxD, isLost(o) ? 'rose' : /WON$/.test(o.stage) ? 'green' : 'violet') },
    { t: 'Jamidan %', r: 1, s: o => div(o.n, dAll), f: o => pct(div(o.n, dAll)) },
    { t: 'Shu bosqichga yetgan', r: 1, s: o => reached(o) ?? -1, f: o => o.total ? num(dAll) : reached(o) == null ? '<span class="text-muted">—</span>' : num(reached(o)) },
    { t: "Oldingi bosqichdan o'tish", r: 1, s: o => { const p = prevOf(o); return p ? div(reached(o), reached(p)) ?? -1 : -1; }, f: o => { const p = !o.total && !isLost(o) && prevOf(o); return p ? chip(pct(div(reached(o), reached(p))), div(reached(o), reached(p)) >= 0.5 ? 'success' : 'danger') : ''; } },
  ], [{ name: 'Jami', n: dAll, total: true, sort: -1, stage: '' }, ...dl]);
  return card(h3('Lead stadiyalari', `${num(all)} ta lead. <b>Hozir shu yerda</b> — lead aynan hozir shu statusda turibdi. <b>Kamida shu yergacha kelgan</b> — Bitrix'dagi statuslar tartibida shu status va undan keyingi barcha statuslardagi leadlar yig'indisi, ya'ni bu bosqichdan o'tib ketganlar ham kiradi. Masalan, «Qayta aloqa» qatoridagi son = hozir «Qayta aloqa», «Qaytgan lidlar», «Качественный лид» va undan keyingi (yopilgan) statuslardagi leadlar. Yopilgan statuslar (SPAM, Dublikat…) uchun «—»: lead qaysi bosqichda yopilgani Bitrix'da saqlanmaydi.`) + leadTable, 'mb-6') +
    card(h3('Deal stadiyalari', `${num(dAll)} ta deal. Yo'qotilgan deal qaysi bosqichda yopilgani Bitrix'da saqlanmaydi, shuning uchun u «yetgan»ga qo'shilmaydi.`) + dealTable, 'mb-6');
}

// When leads arrive and from which phone operator codes (Tashkent time).
const OPERATORS = { 90: 'Beeline', 91: 'Beeline', 92: 'Beeline', 20: 'Beeline (OQ)', 93: 'Ucell', 94: 'Ucell', 50: 'Ucell', 97: 'Mobiuz', 88: 'Mobiuz', 87: 'Mobiuz',
  99: 'Uzmobile', 77: 'Uzmobile', 95: 'Uzmobile', 70: 'Uzmobile', 55: 'Uzmobile', 33: 'Humans', 98: 'Perfectum', 80: 'Perfectum' };
const operatorOf = code => OPERATORS[code] || (code === "yo'q" ? "Raqam yo'q" : code === 'boshqa' ? "Xorijiy / noto'g'ri format" : "Noma'lum kod");
function leads() {
  const H = S.data.hours, C = S.data.codes;
  const total = H.reduce((a, r) => a + +r.leads, 0);
  if (!total) return card(empty("Tanlangan davrda lead yo'q"));
  const add = (o, r) => { o.leads += +r.leads; o.qual += +r.qual; o.won += +r.won; o.unreached += +r.unreached; return o; };
  const blank = key => ({ key, leads: 0, qual: 0, won: 0, unreached: 0 });
  const hours = Array.from({ length: 24 }, (_, h) => blank(h));
  for (const r of H) add(hours[r.hour], r);
  const maxH = Math.max(...hours.map(o => o.leads)), avgQual = div(hours.reduce((a, o) => a + o.qual, 0), total);
  const bars = hours.map(o => { const qr = div(o.qual, o.leads);
    return `<div class="flex flex-col items-center gap-0.5 min-w-0" title="${o.key}:00–${o.key}:59 — ${o.leads} lead, ${o.qual} sifatli (${pct(qr)})"><div class="text-[9px] tabular-nums">${o.leads || ''}</div><div class="text-[9px] tabular-nums ${qr != null && qr >= avgQual ? 'text-success' : 'text-muted'}">${o.leads ? Math.round(qr * 100) + '%' : ''}</div><div class="w-full bg-surface2 rounded-t h-28 flex items-end"><div class="w-full rounded-t ${qr != null && qr >= avgQual ? 'bg-success' : 'bg-info/70'}" style="height:${(o.leads / maxH * 100).toFixed(0)}%"></div></div><div class="text-[10px] text-muted">${o.key}</div></div>`; }).join('');
  // Weekday × hour heatmap (weekday from the Tashkent date).
  const cell = {}; let maxC = 0;
  for (const r of H) { const k = ((new Date(r.day + 'T00:00').getDay() + 6) % 7) + '-' + r.hour; cell[k] = (cell[k] || 0) + +r.leads; maxC = Math.max(maxC, cell[k]); }
  const DOW = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
  const heat = `<div class="overflow-x-auto"><table class="text-[10px] border-separate" style="border-spacing:2px"><thead><tr><th></th>${hours.map(o => `<th class="text-muted font-normal w-6">${o.key}</th>`).join('')}</tr></thead><tbody>${DOW.map((d, i) => `<tr><td class="pr-2 text-muted">${d}</td>${hours.map(o => { const v = cell[i + '-' + o.key] || 0; return `<td class="w-6 h-6 rounded text-center tabular-nums" title="${d} ${o.key}:00 — ${v} lead" style="background:rgb(var(--accent) / ${(v / maxC * 0.9).toFixed(2)})">${v >= maxC * 0.6 ? v : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  const rateCols = name => [
    { t: 'Leadlar', r: 1, f: o => num(o.leads) }, { t: 'Ulushi', r: 1, f: o => pct(div(o.leads, total)), s: o => o.leads },
    { t: 'Sifatli', r: 1, f: o => num(o.qual) }, { t: 'Sifat %', r: 1, f: o => chip(pct(div(o.qual, o.leads)), div(o.qual, o.leads) >= avgQual ? 'success' : 'danger'), s: o => div(o.qual, o.leads) ?? -1 },
    { t: 'Sotuv', r: 1, f: o => num(o.won) }, { t: 'Sotuv %', r: 1, f: o => pct(div(o.won, o.leads)), s: o => div(o.won, o.leads) ?? -1 },
    { t: "Bog'lanib bo'lmadi", r: 1, f: o => pct(div(o.unreached, o.leads)), s: o => div(o.unreached, o.leads) ?? -1 }];
  const codes = {}; for (const r of C) add(codes[r.phone_code] ??= blank(r.phone_code), r);
  const ops = {}; for (const o of Object.values(codes)) { const k = operatorOf(o.key); add(ops[k] ??= blank(k), o); }
  const peak = [...hours].sort((a, b) => b.leads - a.leads).slice(0, 3).map(o => o.key + ':00').join(', ');
  return leadFindings(hours, H, ops, total, avgQual) + card(h3("Leadlar soat bo'yicha (Toshkent vaqti)", `${num(total)} ta lead. Eng ko'p: ${peak}. Ustun ustida: lead soni va sifatli ulushi. Yashil — sifat o'rtachadan (${pct(avgQual)}) yuqori.`) + `<div class="grid gap-0.5" style="grid-template-columns:repeat(24,minmax(0,1fr))">${bars}</div>`, 'mb-6') +
    card(h3('Har bir soat batafsil', "Ustun nomini bosing — eng yuqori/eng past bo'yicha saralanadi") + table([{ t: 'Soat', f: o => `${String(o.key).padStart(2, '0')}:00–${String(o.key).padStart(2, '0')}:59` }, ...rateCols()], hours.filter(o => o.leads)), 'mb-6') +
    card(h3('Hafta kuni × soat', "Rang qanchalik to'q — shuncha ko'p lead. Katakka sichqonchani olib boring — aniq son.") + heat, 'mb-6') +
    card(h3('Operatorlar', "Telefon kodi bo'yicha guruhlangan") + table([{ t: 'Operator', f: o => `<span class="font-semibold">${esc(o.key)}</span>` }, ...rateCols()], Object.values(ops).sort((a, b) => b.leads - a.leads)), 'mb-6') +
    card(h3('Telefon kodlari', "Faqat kod saqlanadi (998 dan keyingi 2 raqam), to'liq raqam emas. «yo'q» — leadda raqam yo'q, «boshqa» — xorijiy yoki noto'g'ri yozilgan raqam.") + table([{ t: 'Kod', f: o => `<span class="font-semibold">${esc(o.key)}</span> <span class="text-xs text-muted">${operatorOf(o.key)}</span>` }, ...rateCols()], Object.values(codes).sort((a, b) => b.leads - a.leads)));
}

// What the hour/weekday/operator data says, each with the step that fixes it.
function leadFindings(hours, H, ops, total, avgQual) {
  const sum = (xs, k) => xs.reduce((a, o) => a + o[k], 0);
  const night = hours.filter(o => o.key >= 20 || o.key < 9), day = hours.filter(o => o.key >= 9 && o.key < 20);
  const nUnr = div(sum(night, 'unreached'), sum(night, 'leads')), dUnr = div(sum(day, 'unreached'), sum(day, 'leads'));
  const nQual = div(sum(night, 'qual'), sum(night, 'leads')), dQual = div(sum(day, 'qual'), sum(day, 'leads'));
  const rated = hours.filter(o => o.leads >= 8).map(o => ({ ...o, q: div(o.qual, o.leads) })).sort((a, b) => b.q - a.q);
  const hh = o => `${String(o.key).padStart(2, '0')}:00`;
  const wd = {}; for (const r of H) { const k = (new Date(r.day + 'T00:00').getDay() + 6) % 7; const o = wd[k] ??= { k, leads: 0, qual: 0 }; o.leads += +r.leads; o.qual += +r.qual; }
  const DOW = ['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba', 'Yakshanba'];
  const wds = Object.values(wd).filter(o => o.leads >= 15).map(o => ({ ...o, q: div(o.qual, o.leads) })).sort((a, b) => b.q - a.q);
  const opWorst = Object.values(ops).filter(o => o.leads >= 20).map(o => ({ ...o, u: div(o.unreached, o.leads) })).sort((a, b) => b.u - a.u)[0];
  const items = [];
  if (sum(night, 'leads') >= 10) items.push(['ph-moon', nUnr > dUnr ? 'rose' : 'teal', `Kechki leadlar (20:00–09:00): ${pct(div(sum(night, 'leads'), total))}`,
    `Bog'lanib bo'lmadi: kechasi ${pct(nUnr)}, kunduzi ${pct(dUnr)}. Sifatli: kechasi ${pct(nQual)}, kunduzi ${pct(dQual)}.`,
    nUnr > dUnr ? "Kechki leadlarga darhol avtomatik Telegram/SMS xabar yuboring («Ertalab 9:00 da qo'ng'iroq qilamiz») va ertalab birinchi soatda faqat ularga qo'ng'iroq qiling." : "Kechki leadlar kunduzgidan yomon emas — ertalab 9:00 dagi navbatni saqlang."]);
  if (rated.length >= 4) items.push(['ph-clock', 'green', `Eng sifatli soatlar: ${rated.slice(0, 3).map(hh).join(', ')}`,
    `Sifatli ulushi ${rated.slice(0, 3).map(o => pct(o.q)).join(', ')} (o'rtacha ${pct(avgQual)}). Eng past: ${rated.slice(-3).map(o => `${hh(o)} ${pct(o.q)}`).join(', ')}.`,
    "Meta'da reklama jadvalini (ad scheduling, lifetime budget bilan) shu soatlarga ko'proq yo'naltiring; past soatlarda qo'ng'iroq qilish tezligini tekshiring."]);
  if (wds.length >= 4) items.push(['ph-calendar', 'violet', `Eng yaxshi kun: ${DOW[wds[0].k]} (${pct(wds[0].q)}), eng yomoni: ${DOW[wds[wds.length - 1].k]} (${pct(wds[wds.length - 1].q)})`,
    `Hafta kunlari bo'yicha sifatli lead ulushi.`, "Byudjetni yomon kunlarda biroz kamaytirib, yaxshi kunlarga o'tkazing; yomon kunda menejerlar soni yetarlimi — tekshiring."]);
  if (opWorst && opWorst.u > 0) items.push(['ph-phone-x', 'amber', `Eng ko'p «bog'lanib bo'lmadi»: ${opWorst.key} raqamlari (${pct(opWorst.u)})`,
    `${num(opWorst.leads)} ta lead shu operatordan.`, "Bu raqamlarga qo'ng'iroqdan oldin Telegram orqali yozish yoki boshqa vaqtda qayta urinish qoidasini qo'ying."]);
  if (!items.length) return '';
  return card(h3('Nima topildi va nima qilish kerak', "Avtomatik xulosa: tanlangan davrdagi leadlar soat, hafta kuni va telefon operatori bo'yicha.") +
    `<div class="grid md:grid-cols-2 gap-3">${items.map(([icon, tone, title, fact, action]) => `<div class="rounded-2xl bg-surface2 p-4"><div class="flex items-center gap-2 text-[13px] font-semibold"><i class="ph-bold ${icon}" style="color:rgb(var(--c-${tone}))"></i>${title}</div><div class="text-[12px] text-muted mt-1">${fact}</div><div class="text-[12.5px] mt-2"><i class="ph-bold ph-arrow-right text-accent"></i> ${action}</div></div>`).join('')}</div>`, 'mb-6');
}

const WD = ['Ya', 'Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh'];
function daily() {
  const rows = S.data.daily;
  if (!rows.length) return card(empty("Tanlangan davrda lead yo'q"));
  const bySrc = groupSum(rows, r => r.source).sort((a, b) => b.leads - a.leads);
  const [tot] = groupSum(rows, () => 'all');
  const view = S.dailyView || 'src', picked = S.source;
  const rate = (o, k) => div(o[k], o.leads);
  // Findings only from sources with enough leads to mean something.
  const big = bySrc.filter(o => o.leads >= 10);
  const pick = (k, dir) => [...big].sort((a, b) => dir * ((rate(b, k) ?? -1) - (rate(a, k) ?? -1)))[0];
  const finding = (icon, tone, title, o, k, what) => o ? `<div class="rounded-2xl bg-surface2 p-3.5"><div class="flex items-center gap-2 text-[12px] font-semibold" style="color:rgb(var(--c-${tone}))"><i class="ph-bold ${icon}"></i>${title}</div><div class="mt-1 text-[14px] font-semibold">${esc(o.key)} — ${pct(rate(o, k))}</div><div class="text-[11.5px] text-muted mt-0.5">o'rtacha ${pct(rate(tot, k))} · ${num(o.leads)} lead. ${what}</div></div>` : '';
  const findings = big.length < 2 ? '' : `<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
    ${finding('ph-star', 'teal', 'Eng sifatli manba', pick('qual', 1), 'qual', "Byudjet/e'tiborni shu manbaga ko'paytiring.")}
    ${finding('ph-trophy', 'green', 'Sotuvga eng yaxshi', pick('won', 1), 'won', "Shu manba leadlariga birinchi navbatda qo'ng'iroq.")}
    ${finding('ph-trash', 'rose', "Eng ko'p sifatsiz", pick('junk', 1), 'junk', "Forma savollari yoki auditoriyani tekshiring.")}
    ${finding('ph-hourglass', 'amber', 'Eng ko\'p hal qilinmagan', pick('in_progress', 1), 'in_progress', "Bu leadlar hali ochiq — menejerlar qayta aloqa qilsin.")}</div>`;
  const cell = (n, of) => `${num(n)} <span class="text-[11px] text-muted">${pct(div(n, of))}</span>`;
  const cols = (label, keyCell) => [{ t: label, f: r => r._foot ? '<b>Jami</b>' : keyCell(r), s: r => r.key },
    { t: 'Leadlar', r: 1, s: r => r.leads, f: r => num(r.leads) },
    { t: 'Aloqa', r: 1, s: r => rate(r, 'contacted') ?? -1, f: r => cell(r.contacted, r.leads) },
    { t: 'Sifatli', r: 1, s: r => rate(r, 'qual') ?? -1, f: r => r._foot ? cell(r.qual, r.leads) : `${num(r.qual)} ${chip(pct(rate(r, 'qual')), (rate(r, 'qual') ?? 0) >= (rate(tot, 'qual') ?? 0) ? 'success' : 'danger')}` },
    { t: 'Filialga keldi', r: 1, s: r => r.came_to_branch, f: r => num(r.came_to_branch) },
    { t: 'Sotuv', r: 1, s: r => rate(r, 'won') ?? -1, f: r => cell(r.won, r.leads) },
    { t: 'Jarayonda', r: 1, s: r => r.in_progress, f: r => num(r.in_progress) },
    { t: 'Sifatsiz', r: 1, s: r => rate(r, 'junk') ?? -1, f: r => cell(r.junk, r.leads) }];
  const seg = `<div class="inline-flex p-1 bg-surface2 rounded-xl text-xs font-semibold">${[['src', 'Manbalar'], ['day', 'Kunlar']].map(([k, t]) => `<button onclick="S.dailyView='${k}';render()" class="px-3 h-7 rounded-lg ${view === k ? 'bg-surface shadow-sm text-fg' : 'text-muted hover:text-fg'}">${t}</button>`).join('')}</div>`;
  const srcSelect = `<select onchange="S.source=this.value;render()" class="h-9 px-2 rounded-xl bg-surface2 border border-line text-sm"><option value="">Barcha manbalar</option>${bySrc.map(o => `<option ${o.key === picked ? 'selected' : ''} value="${esc(o.key)}">${esc(o.key)} (${num(o.leads)})</option>`).join('')}</select>`;
  const body = view === 'src'
    ? table(cols('Manba', r => `<button onclick="S.source='${esc(r.key).replace(/'/g, "\\'")}';S.dailyView='day';render()" class="font-semibold hover:text-accent text-left">${esc(r.key)}</button>`), bySrc, tot)
    : (() => { const ds = groupSum(rows.filter(r => !picked || r.source === picked), r => r.day).sort((a, b) => b.key.localeCompare(a.key)); const [t2] = groupSum(rows.filter(r => !picked || r.source === picked), () => 'all');
      return table(cols('Sana', r => `<span class="font-semibold tabular-nums">${r.key.slice(8)}.${r.key.slice(5, 7)}</span> <span class="text-xs text-muted">${WD[new Date(r.key + 'T00:00').getDay()]}</span>`), ds, t2); })();
  return card(`<div class="flex flex-wrap items-center gap-3 mb-4">${seg}${view === 'day' ? srcSelect : ''}</div>` +
    h3(view === 'src' ? 'Manbalar: qaysi kanal sifatli lead va sotuv beradi' : `Kunlar${picked ? ' — ' + esc(picked) : ''}: qaysi kun leadlari yaxshi ishlandi`,
      "Lead kelgan kun bo'yicha. Foizlar — o'sha qatordagi leadlardan. Yashil/qizil — o'rtachadan yuqori/past. Manba nomini bosing — o'sha manbaning kunlari ochiladi.") + findings + body);
}

const moneyShort = n => n == null ? '—' : Math.abs(n) >= 1e9 ? (n / 1e9).toFixed(2) + ' mlrd' : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1) + ' mln' : num(n);
function moneyPage() {
  const d = S.data, days = d.cycle.map(r => +r.days).sort((a, b) => a - b);
  const kpi = (l, v, sub, color) => `<div class="bg-surface border border-line rounded-2xl p-4 relative overflow-hidden"><div class="absolute inset-x-0 top-0 h-1" style="background:rgb(var(--c-${color}))"></div><div class="text-xs text-muted">${l}</div><div class="text-xl font-bold mt-1 tabular-nums">${v}</div>${sub ? `<div class="text-[11px] text-muted mt-0.5">${sub}</div>` : ''}</div>`;
  const tot = d.money.reduce((a, r) => ({ deals: a.deals + +r.deals, won: a.won + +r.won, lost: a.lost + +r.lost, amount: a.amount + +r.amount, paid: a.paid + +r.paid_amount, rem: a.rem + +(r.remaining || 0) }), { deals: 0, won: 0, lost: 0, amount: 0, paid: 0, rem: 0 });
  const q = f => days.length ? days[Math.min(days.length - 1, Math.floor(f * (days.length - 1)))] : null;
  const avg = days.length ? days.reduce((a, b) => a + b, 0) / days.length : null;
  const fmtD = v => v == null ? '—' : v < 1 ? Math.round(v * 24) + ' soat' : v.toFixed(1).replace('.0', '') + ' kun';
  // Sales cycle: min / median / average / max as bars, plus a distribution.
  const stats = [['Eng tez', q(0), 'green'], ['Mediana (yarmi shundan tez)', q(0.5), 'teal'], ["O'rtacha", avg, 'blue'], ['Eng uzoq', q(1), 'rose']];
  const maxD = Math.max(1, ...stats.map(x => x[1] || 0));
  const buckets = [['Shu kuni', 0, 1], ['1–3 kun', 1, 4], ['4–7 kun', 4, 8], ['8–14 kun', 8, 15], ['15–30 kun', 15, 31], ['31–60 kun', 31, 61], ['60+ kun', 61, 1e9]].map(([l, a, b]) => [l, days.filter(x => x >= a && x < b).length]);
  const maxB = Math.max(1, ...buckets.map(b => b[1]));
  const cum = []; buckets.reduce((acc, [, n]) => { cum.push(acc + n); return acc + n; }, 0);
  const tile = (l, v, sub) => `<div class="rounded-xl bg-surface2 border border-line p-4"><div class="text-xs text-muted">${l}</div><div class="text-2xl font-bold tabular-nums mt-1">${v}</div><div class="text-[11px] text-muted mt-0.5">${sub}</div></div>`;

// Recording is streamed by the call-audio function with the admin's session.
async function playCall(id) {
  const box = $('aud'); box.innerHTML = '<span class="text-sm text-muted">Yozuv yuklanmoqda…</span>';
  try {
    const { data } = await sbc.auth.getSession();
    const res = await fetch(`${SB_URL}/functions/v1/call-audio?id=${encodeURIComponent(id)}`, { headers: { authorization: `Bearer ${data.session?.access_token}`, apikey: SB_KEY } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    box.innerHTML = `<audio controls autoplay class="w-full" src="${URL.createObjectURL(await res.blob())}"></audio>`;
  } catch (e) { box.innerHTML = `<span class="text-sm text-danger">Yozuvni ochib bo'lmadi: ${esc(e.message)}</span>`; }
}

// AI review of Bitrix call recordings (call-analyze edge function, Gemini free tier), for the selected dates.
function calls() {
  if (S.call) return callDetail();
  const all = S.data.calls || [], ok = analysed(), sales = ok.filter(isSale);
  const queued = all.filter(r => !r.transcript && !r.error).length, failed = all.filter(r => !r.transcript && r.error).length;
  const F = S.callF ||= { type: 'sotuv', low: false };
  const top = (xs, k, n = 8) => Object.entries(xs.flatMap(r => r[k] || []).reduce((m, x) => (m[x.toLowerCase()] = (m[x.toLowerCase()] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]).slice(0, n);
  const list = (t, sub, rows, color) => card(h3(t, sub) + (rows.length ? rows.map(([x, n]) => `<div class="flex items-center justify-between gap-3 py-1.5 border-b border-line/60 last:border-0 text-[13px]"><span>${esc(x)}</span>${bar(n, rows[0][1], color, num(n))}</div>`).join('') : empty("Ma'lumot yo'q")));
  const booked = sales.filter(r => r.outcome === 'yozildi').length;
  // Team average per script stage: where points are lost.
  const stages = RUBRIC.map(([st, t]) => ({ st, t, v: avgOf(sales, c => c.stages?.[st]) })).filter(x => x.v != null);
  const weakest = [...stages].sort((a, b) => a.v - b.v)[0];
  const mgrs = managerRows().filter(r => r.sales.length).map(r => ({ ...r, booked: div(r.sales.filter(c => c.outcome === 'yozildi').length, r.sales.length) })).sort((a, b) => (a.total ?? 101) - (b.total ?? 101));
  const weakStage = r => { const e = Object.entries(r.stages).filter(([, v]) => v != null).sort((a, b) => a[1] - b[1])[0]; return e ? RUBRIC.find(x => x[0] === e[0])[1] : '—'; };
  let shown = F.type === 'sotuv' ? sales : ok;
  if (F.low) shown = shown.filter(c => c.total != null && c.total < 50);
  const seg = (items, cur, set) => `<div class="inline-flex p-1 bg-surface2 rounded-xl text-xs font-semibold">${items.map(([k, t]) => `<button onclick="${set.replace('$', k)}" class="px-3 h-7 rounded-lg ${cur === k ? 'bg-surface shadow-sm text-fg' : 'text-muted hover:text-fg'}">${t}</button>`).join('')}</div>`;
  return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">${kpiTile("Sotuv qo'ng'iroqlari", num(sales.length), `${num(ok.length)} ta tahlildan · eslatma/xizmat ballga kirmaydi${queued ? ` · ${num(queued)} navbatda` : ''}${failed ? ` · ${num(failed)} xato` : ''}`, 'blue')}${kpiTile("O'rtacha ball", avgOf(sales, c => c.total)?.toFixed(0) ?? '—', '100 ballik reglament · 75+ yaxshi', 'amber')}${kpiTile('Sinov darsiga yozildi', pct(div(booked, sales.length)), `${num(booked)} ta sotuv qo'ng'irog'idan`, 'green')}${kpiTile('Jamoaning zaif bosqichi', weakest ? esc(weakest.t) : '—', weakest ? `o'rtacha ${Math.round(weakest.v)} / 100` : '', 'rose')}</div>
  <div class="grid lg:grid-cols-2 gap-4 mb-6">
    ${card(h3('Jamoa qayerda ball yo\'qotyapti', "Skript bosqichlari bo'yicha o'rtacha (100 ga keltirilgan). Eng qisqa chiziq — birinchi navbatda o'rgatish kerak bo'lgan bosqich.") + (stages.length ? stages.map(x => `<div class="flex items-center justify-between gap-3 py-1.5 text-[13px]"><span class="w-44 shrink-0">${x.t}</span>${bar(x.v, 100, x.v >= 75 ? 'green' : x.v >= 50 ? 'amber' : 'rose', Math.round(x.v))}</div>`).join('') : empty("Sotuv qo'ng'irog'i yo'q")))}
    ${card(h3('Menejerlar', "Eng past balldan boshlab. Ismni bosing — uning qo'ng'iroqlari va xatolari.") + (mgrs.length ? table([
      { t: 'Menejer', f: r => `<button ${go(r.key)} class="font-semibold text-left hover:text-accent">${esc(r.name)}</button>` },
      { t: "Qo'ng'iroq", r: 1, s: r => r.sales.length, f: r => num(r.sales.length) }, { t: 'Ball', r: 1, s: r => r.total ?? -1, f: r => scoreChip(r.total == null ? null : Math.round(r.total)) },
      { t: 'Yozildi', r: 1, s: r => r.booked ?? -1, f: r => pct(r.booked) }, { t: 'Zaif bosqich', f: r => esc(weakStage(r)) },
    ], mgrs) : empty("Ma'lumot yo'q")))}
  </div>
  <div class="grid lg:grid-cols-2 gap-4 mb-6">${list('Operator xatolari', "Sotuv qo'ng'iroqlarida eng ko'p takrorlanadigan — o'quv mavzusi", top(sales, 'mistakes'), 'amber')}${list("Mijoz e'tirozlari", "Eng ko'p eshitilgan — skriptda javobi bo'lishi kerak", top(sales, 'objections'), 'rose')}</div>
  ${card(`<div class="flex flex-wrap items-center gap-3 mb-4">${seg([['sotuv', 'Sotuv'], ['all', 'Hammasi']], F.type, "S.callF.type='$';render()")}<label class="inline-flex items-center gap-2 text-sm"><input type="checkbox" ${F.low ? 'checked' : ''} onchange="S.callF.low=this.checked;render()"> Faqat past ball (&lt;50)</label><span class="text-xs text-muted ml-auto">${num(shown.length)} ta</span></div>` +
    h3("Qo'ng'iroqlar", "Bosing — yozuv, xatolar va «o'rniga nima deyish kerak edi», reglament bo'yicha baho va dialog.") + callList([...shown].sort((a, b) => String(b.call_start).localeCompare(String(a.call_start)))), 'mb-6')}
  <details class="bg-surface rounded-3xl p-4 sm:p-5"><summary class="cursor-pointer font-semibold text-[15px]">Baholash reglamenti (100 ball) — qanday hisoblanadi</summary><div class="mt-4">${rubricCard().replace(/^<div class="bg-surface rounded-3xl p-4 sm:p-5 ">/, '<div>')}</div></details>`;
}

async function genBriefs() {
  S.briefBusy = true; render();
  try {
    const { data } = await sbc.auth.getSession();
    const res = await fetch(`${SB_URL}/functions/v1/brief-generate`, { method: 'POST', headers: { authorization: `Bearer ${data.session?.access_token}`, apikey: SB_KEY } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || res.status);
    S.data.briefs = await q('briefs', x => x.order('created_at', { ascending: false }));
  } catch (e) { alert("Brief yaratib bo'lmadi: " + e.message); }
  S.briefBusy = false; render();
}

async function setBrief(id, status) {
  const { error } = await sbc.from('briefs').update({ status }).eq('id', id);
  if (error) return alert(error.message);
  S.data.briefs.find(b => b.id === id).status = status; render();
}

const list = id => $(id).value.split(',').map(s => s.trim()).filter(Boolean);
async function saveCfg(e) {
  e.preventDefault();
  const patch = { qual_statuses: list('cfQual'), won_stages: list('cfWon'), lost_stages: list('cfLost'), min_call_seconds: +$('cfMin').value || 30, updated_at: new Date().toISOString() };
  const { error } = await sbc.from('audit_settings').update(patch).eq('id', 1);
  if (error) return alert(error.message);
  Object.assign(S.data.cfg, patch); alert('Saqlandi. Keyingi sinxronizatsiyada qo\'llanadi.');
}
async function saveFx(e, auto) {
  e.preventDefault();
  const rate = +$('cfFx').value;
  if (!auto && !(rate > 0)) return alert("Kursni kiriting");
  const patch = auto ? { fx_manual: false } : { fx_rate: rate, fx_manual: true, fx_date: iso(new Date()) };
  const { error } = await sbc.from('audit_settings').update(patch).eq('id', 1);
  if (error) return alert(error.message);
  Object.assign(S.data.cfg, patch); render();
  alert(auto ? "Keyingi sinxronizatsiyada Markaziy bank kursi olinadi." : "Saqlandi: so'mdagi barcha hisoblar shu kursda.");
}
async function saveCourses() {
  for (const row of document.querySelectorAll('[data-course]')) {
    const k = S.data.courses.find(c => c.course === row.dataset.course), val = n => +row.querySelector(`[name=${n}]`).value;
    const patch = { avg_check: val('avg_check'), ad_share: val('ad_share') };
    if (Math.abs(val('qual_to_sale') - k.qual_to_sale) > 0.0005) Object.assign(patch, { qual_to_sale: val('qual_to_sale'), qual_to_sale_manual: true });
    const { error } = await sbc.from('course_settings').update(patch).eq('course', k.course);
    if (error) return alert(error.message);
  }

async function askAI(text) {
