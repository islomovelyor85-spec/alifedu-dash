  return `<div class="flex items-baseline justify-between gap-3 mb-2"><h3 class="font-semibold">Konversiyalar</h3><span class="text-[11px] text-muted">Shu davrda kelgan leadlar ichida${saleMode() && allSold !== sold ? `: davrdagi ${num(allSold)} ta sotuvdan ${num(sold)} tasi shu leadlardan, qolgani oldingi oylar leadlaridan` : ''}</span></div><div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3 mb-6">${steps.map(tile).join('')}</div>`;
}

// ---------- Plan: months of the selected range, each counted for the days it covers ----------
const monthName = key => `${MONTH_FULL[+key.slice(5, 7) - 1]} ${key.slice(0, 4)}`;
function planRange(from = S.from, to = S.to) {
  const R = { leads: 0, qual: 0, came: 0, sales: 0, budget: 0, months: [], missing: [], p: null };
  for (let m = new Date(from.slice(0, 7) + '-01T00:00'); iso(m) <= to; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    const key = iso(m), dim = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(), last = iso(new Date(m.getFullYear(), m.getMonth(), dim));
    const a = key < from ? from : key, b = last > to ? to : last, scale = (Math.round((new Date(b) - new Date(a)) / 864e5) + 1) / dim;
    const p = S.data.plans.find(x => x.month === key);
    R.months.push({ key, p, scale, dim });
    if (!p || !+p.sales) { R.missing.push(key); continue; }
    const n = planNeed(p); R.leads += n.leads * scale; R.qual += n.qual * scale; R.came += n.came * scale; R.sales += n.sales * scale; R.budget += n.budget * scale; R.p = p;
  }
  R.has = !!R.p;
  return R;
}
const planTile = (l, fact, plan, f = num) => { const r = div(fact, plan); return `<div class="bg-surface rounded-3xl p-5"><div class="flex justify-between items-baseline"><span class="text-xs text-muted">${l}</span>${plan ? `<span class="text-xs font-semibold tabular-nums">${pct(r)}</span>` : ''}</div><div class="text-[26px] font-bold tabular-nums mt-1">${f(fact)}</div><div class="text-[11px] text-muted">reja ${plan ? f(plan) : '—'}</div><div class="mt-2 h-1.5 rounded-full bg-surface2 overflow-hidden"><div class="h-full rounded-full" style="width:${Math.min((r || 0) * 100, 100).toFixed(1)}%;background:rgb(var(--c-${r >= 0.9 ? 'green' : r >= 0.7 ? 'amber' : 'rose'}))"></div></div></div>`; };
function planStrip(t, sold, spend) {
  const R = planRange(), goSet = `S.sec.overview='set';S.planMonth='${(R.missing[R.missing.length - 1] || S.to).slice(0, 7)}';render()`;
  const miss = R.missing.length ? `${R.missing.map(monthName).join(', ')} uchun reja kiritilmagan` : '';
  if (!R.has) return card(`<div class="flex flex-wrap items-center justify-between gap-3"><div><div class="font-semibold">Reja va fakt</div><div class="text-xs text-muted mt-0.5">${miss}. Reja kiritilsa, bu yerda har bir ko'rsatkich rejaga solishtiriladi.</div></div><button onclick="${goSet}" class="h-10 px-4 rounded-xl bg-fg text-surface text-sm font-semibold">Rejani kiritish</button></div>`, 'mb-6');
  // Month forecast: only when the range ends today, sales counted by sale date.
  const today = iso(new Date()), mKey = today.slice(0, 7) + '-01', cur = S.data.plans.find(x => x.month === mKey);
  let fc = '';
  if (S.to === today && cur && +cur.sales) {
    const elapsed = +today.slice(8), dim = new Date(+today.slice(0, 4), +today.slice(5, 7), 0).getDate(), left = dim - elapsed;
    const mSold = (S.data.purchases || []).filter(p => p.day >= mKey && p.day <= today).length, forecast = Math.round(mSold / elapsed * dim);
    fc = `<div class="rounded-2xl bg-surface2 p-3.5 text-[13px] mt-3"><b>${MONTH_FULL[+today.slice(5, 7) - 1]} prognozi:</b> shu tezlikda oy <b>${num(forecast)} ta sotuv</b> bilan tugaydi (reja ${num(+cur.sales)}, ${pct(div(forecast, +cur.sales))}).${forecast < +cur.sales && left ? ` Rejaga yetish uchun qolgan ${left} kunda kuniga <b>${num(Math.ceil((+cur.sales - mSold) / left))} ta</b> sotuv kerak (hozir kuniga ${(mSold / elapsed).toFixed(1)}).` : ''}</div>`;
  }
  return `<div class="flex items-baseline justify-between gap-3 mb-2"><h3 class="font-semibold">Reja va fakt</h3><button onclick="${goSet}" class="text-[11.5px] text-accent font-semibold">Rejani o'zgartirish</button></div><div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3">${planTile('Lead', t.leads, R.leads)}${planTile('Sifatli lead', t.qual, R.qual)}${planTile('Filialga keldi', t.came_to_branch, R.came)}${planTile('Sotuv', sold, R.sales)}${planTile('Reklama xarajati', spend, R.budget, v => adMoney(v, false))}</div>
    <p class="text-[11px] text-muted mt-2">Reja tanlangan kunlarga bo'lingan (oy rejasi × kunlar ulushi).${miss ? ' ' + miss + " — u kunlar rejaga qo'shilmagan." : ''}</p>${fc}<div class="mb-6"></div>`;
}
function planWhy() {
  const R = planRange();
  if (!R.has) return card(empty('Avval rejani kiriting'));
  const [t = { leads: 0, qual: 0, came_to_branch: 0, won: 0, in_progress: 0 }] = groupSum(S.data.daily, () => 'all');
  const causes = planCauses(R.p, t, salesList(true).length, { leads: R.leads }, 1);
  const tone = { danger: 'border-danger/40 bg-danger/10', warn: 'border-warn/40 bg-warn/10', success: 'border-success/40 bg-success/10' };
  return card(h3('Nega orqadamiz va nima qilish kerak', 'Tanlangan davr raqamlaridan avtomatik') + (causes.length ? `<div class="grid lg:grid-cols-2 gap-3">${causes.map(c => `<div class="rounded-2xl border ${tone[c.tone]} p-4"><div class="font-semibold text-[13.5px]">${c.title}</div><div class="text-[13px] mt-1">${c.msg}</div>${c.action ? `<div class="text-[13px] mt-1.5 font-medium"><i class="ph-bold ph-arrow-right"></i> ${c.action}</div>` : ''}</div>`).join('')}</div>` : empty("Katta og'ish topilmadi")), 'mb-6');
}

// Channels on the overview: every sale lands in a row, so the footer equals the Sotuv card.
function channelTable(rows, wonRows) {
  const by = {}; const blank = key => ({ key, leads: 0, qual: 0, in_progress: 0, junk: 0, won: 0, sold: 0 });
  for (const o of groupSum(rows, r => channelOf(r.source))) Object.assign(by[o.key] ??= blank(o.key), { leads: o.leads, qual: o.qual, in_progress: o.in_progress, junk: o.junk, won: o.won });
  for (const r of bySource(wonRows)) (by[channelOf(r.source)] ??= blank(channelOf(r.source))).sold += +r.won;
  const sale = saleMode(), val = o => sale ? o.sold : o.won;
  const list = Object.values(by).filter(o => o.leads || val(o)).sort((a, b) => b.leads - a.leads);
  const foot = list.reduce((t, o) => { for (const k of ['leads', 'qual', 'in_progress', 'junk', 'won', 'sold']) t[k] += o[k]; return t; }, { ...blank('Jami'), _foot: true });
  const q = o => div(o.qual, o.leads), avg = q(foot);
  return card(h3(S.source ? `Kanal: ${esc(S.source)}` : 'Kanallar', `Lead, sifatli va jarayondagilar — shu davrda kelgan leadlar. Sotuv — ${sale ? "shu davrda yopilganlar, lead qachon kelganidan qat'i nazar" : 'faqat shu davr leadlaridan'}.`) + table([
    { t: 'Kanal', f: o => o._foot ? 'Jami' : `<button data-c="${esc(o.key)}" onclick="S.source=this.dataset.c;render()" class="font-semibold hover:text-accent text-left">${esc(o.key)}</button>`, s: o => o.key },
    { t: 'Leadlar', r: 1, s: o => o.leads, f: o => num(o.leads) },
    { t: 'Sifatli', r: 1, s: o => o.qual, f: o => num(o.qual) },
    { t: 'Sifatli %', r: 1, s: o => q(o) ?? -1, f: o => o._foot || q(o) == null ? pct(q(o)) : chip(pct(q(o)), q(o) >= avg ? 'success' : 'danger') },
    { t: 'Sotuv', r: 1, s: val, f: o => num(val(o)) },
    { t: 'Jarayonda', r: 1, s: o => o.in_progress, f: o => num(o.in_progress) },
    { t: 'Sifatsiz', r: 1, s: o => o.junk, f: o => num(o.junk) },
  ], list, foot));
}

// Sales counted by the month they happened, split by the month the lead came in.
function salesByMonth(list) {
  const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
  const by = {};
  for (const o of list) for (const k of [0, 1, 2, 3]) {
    const n = o.m[k] || 0; if (!n) continue;
    const key = iso(new Date(+o.month.slice(0, 4), +o.month.slice(5, 7) - 1 + k, 1)).slice(0, 7);
    const r = by[key] ??= { key, total: 0, k: [0, 0, 0, 0] }; r.total += n; r.k[k] += n;
  }
  const rows = Object.values(by).sort((a, b) => b.key.localeCompare(a.key)), mx = Math.max(1, ...rows.map(r => r.total));
  const part = (r, k) => r.k[k] ? `${num(r.k[k])} <span class="text-xs text-muted">${pct(div(r.k[k], r.total))}</span>` : '<span class="text-muted">0</span>';
  return card(h3("Oy bo'yicha jami sotuvlar", "Sotuv bo'lgan oy bo'yicha: shu oydagi barcha sotuvlar va ular qaysi oy leadlaridan kelgani. Masalan, oktyabr sotuvlarining bir qismi — sentyabr leadlari.") + table([
    { t: 'Sotuv oyi', s: r => r.key, f: r => `<b>${MONTHS[+r.key.slice(5, 7) - 1]} ${r.key.slice(0, 4)}</b>` },
    { t: 'Jami sotuv', r: 1, s: r => r.total, f: r => bar(r.total, mx, 'green') },
    { t: "Shu oy leadlaridan", r: 1, s: r => r.k[0], f: r => part(r, 0) },
    { t: "O'tgan oy leadlaridan", r: 1, s: r => r.k[1], f: r => part(r, 1) },
    { t: '2 oy oldingi leadlardan', r: 1, s: r => r.k[2], f: r => part(r, 2) },
    { t: '3+ oy oldingi', r: 1, s: r => r.k[3], f: r => part(r, 3) },
  ], rows), 'mb-6');
}

// Sales kanban: one column per sale month; cards per source show which lead month each sale came from.
const AGE = [[0, 'Shu oy leadlari', 'green'], [1, "O'tgan oy leadlari", 'amber'], [2, '2 oy oldingi', 'teal'], [3, 'Eski leadlar', 'violet'], [-1, 'Leadsiz', 'crimson']];
function salesKanban(cohortList) {
  const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
  const rows = bySource(S.data.salesMonth);
  // Months touched by the selected dates (latest 3 when the range has no sales).
  const all = [...new Set(rows.map(r => r.sale_month))].sort().reverse(), inRange = all.filter(m => m.slice(0, 7) >= S.from.slice(0, 7) && m.slice(0, 7) <= S.to.slice(0, 7));
  const months = (inRange.length ? inRange : all).slice(0, 6);
  if (!months.length) return card(empty("Sotuv yo'q"));
  // Leads of a month not decided inside it (sold later or still open) — carried into the next month.
  const carried = m => { const o = cohortList.find(x => x.month === m); return o ? o.still_open + o.won_later : null; };
  const seg = (by, total) => `<div class="flex h-2 rounded-full overflow-hidden bg-surface2">${AGE.map(([a, , c]) => by[a] ? `<div style="width:${(by[a] / total * 100).toFixed(1)}%;background:rgb(var(--c-${c}))"></div>` : '').join('')}</div>`;
  const col = m => {
    const mine = rows.filter(r => r.sale_month === m), won = mine.filter(r => r.kind === 'won'), paid = mine.filter(r => r.kind === 'paid');
    const total = won.reduce((a, r) => a + +r.sales, 0), paidN = paid.reduce((a, r) => a + +r.sales, 0);
    const byAge = {}; for (const r of won) byAge[r.age] = (byAge[r.age] || 0) + +r.sales;
    const src = {}; for (const r of won) { const o = src[channelOf(r.source)] ??= { n: 0, by: {} }; o.n += +r.sales; o.by[r.age] = (o.by[r.age] || 0) + +r.sales; }
    const cards = Object.entries(src).sort((a, b) => b[1].n - a[1].n).map(([name, o]) => `<div class="rounded-2xl bg-surface2 p-3.5">
        <div class="flex items-baseline justify-between gap-2"><span class="text-[13px] font-semibold truncate">${esc(name)}</span><span class="text-lg font-bold tabular-nums">${num(o.n)}</span></div>
        <div class="mt-2">${seg(o.by, o.n)}</div>
        <div class="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-muted">${AGE.filter(([a]) => o.by[a]).map(([a, l, c]) => `<span><b class="tabular-nums" style="color:rgb(var(--c-${c}))">${o.by[a]}</b> ${l.toLowerCase()}</span>`).join('')}</div></div>`).join('');
    const cr = carried(m), cur = m.slice(0, 7) === new Date().toISOString().slice(0, 7);
    return `<div class="min-w-[280px] flex-1 rounded-3xl bg-surface p-4 flex flex-col gap-3">
      <div class="flex items-center justify-between"><span class="font-semibold">${MONTHS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}</span>${cur ? '<span class="text-[11px] px-2 py-0.5 rounded-full bg-accent/15 text-accent">joriy oy</span>' : ''}</div>
      <div><div class="text-4xl font-bold tabular-nums">${num(total)}</div><div class="text-xs text-muted">sotuv («Сделка успешна»)${paidN ? ` · yana <b class="text-fg">${paidN}</b> ta «To'lov qildi», hali yopilmagan` : ''}</div></div>
      ${seg(byAge, total)}
      <div class="grid grid-cols-2 gap-2">${AGE.filter(([a]) => byAge[a]).map(([a, l, c]) => `<div class="rounded-xl px-3 py-2" style="background:rgb(var(--c-${c}) / .12)"><div class="text-lg font-bold tabular-nums" style="color:rgb(var(--c-${c}))">${byAge[a]}</div><div class="text-[11px] text-muted">${l}</div></div>`).join('')}</div>
      ${cr != null ? `<div class="rounded-xl border border-dashed border-line px-3 py-2 text-xs text-muted">→ Keyingi oyga o'tdi: <b class="text-fg tabular-nums">${num(cr)}</b> ta lead${cur ? ' (oy hali tugamagan)' : ''}</div>` : ''}
      <div class="text-[11px] uppercase tracking-wide text-muted mt-1">Kanallar bo'yicha</div>
      <div class="flex flex-col gap-2">${cards}</div></div>`;
  };
  return card(h3(`Oy bo'yicha sotuvlar${S.source ? ' — ' + esc(S.source) : ''}`, "Har ustun — sotuv bo'lgan oy. Raqamlar sotuv qaysi oy leadidan kelganini ko'rsatadi. «Eski leadlar» — 2 oydan oldingi yoki platformaga yuklanmagan leadlar (iyuldan oldin).") +
    `<div class="flex gap-4 overflow-x-auto pb-2 -mx-1 px-1">${months.map(col).join('')}</div>`);
}
function cohort() {
  const by = {};
  for (const r of bySource(S.data.cohortSrc)) {
    const o = by[r.lead_month] ??= { month: r.lead_month, leads: 0, won: 0, still_open: 0, m: {} };
    o.leads += +r.leads; o.won += +r.won; o.still_open += +r.still_open;
    [0, 1, 2, 3].forEach(k => { o.m[k] = (o.m[k] || 0) + +r['m' + k]; });
  }
  const list = Object.values(by).filter(o => o.month >= '2026-07-01' && o.month.slice(0, 7) <= S.to.slice(0, 7)).map(o => ({ ...o, won_same_month: o.m[0], won_later: o.m[1] + o.m[2] + o.m[3] })).sort((a, b) => b.month.localeCompare(a.month));
  if (!list.length) return card(empty("Ma'lumot yo'q"));
  const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
  const name = m => MONTHS[+m.slice(5, 7) - 1], nextName = (m, k) => MONTHS[(+m.slice(5, 7) - 1 + k) % 12];
  const COLORS = ['green', 'teal', 'blue', 'violet'];
  const maxM = Math.max(1, ...list.flatMap(o => [0, 1, 2, 3].map(k => o.m[k] || 0)));
  const carried = o => o.still_open + o.won_later;
  const mx = f => Math.max(1, ...list.map(f));
  const cell = (o, k) => { const n = o.m[k] || 0, future = new Date(+o.month.slice(0, 4), +o.month.slice(5, 7) - 1 + k, 1) > new Date();
    if (future) return `<td class="p-1"><div class="h-16 rounded-xl border border-dashed border-line flex items-center justify-center text-[11px] text-muted">hali kelmadi</div></td>`;
    const c = COLORS[k];
    return `<td class="p-1"><div class="h-16 rounded-xl bg-surface2 border border-line px-2 py-1.5 flex flex-col justify-between"><div class="flex items-baseline justify-between gap-1"><span class="text-lg font-bold tabular-nums" style="color:rgb(var(--c-${c}))">${n}</span><span class="text-[10px] text-muted">${nextName(o.month, k)}</span></div><div class="text-[10px] text-muted">sotildi · ${pct(div(n, o.leads))}</div><div class="h-1 rounded-full bg-line"><div class="h-1 rounded-full" style="width:${(n / maxM * 100).toFixed(0)}%;background:rgb(var(--c-${c}))"></div></div></div></td>`; };
  const split = o => [0, 1, 2, 3].filter(k => o.m[k]).map(k => `<span style="color:rgb(var(--c-${COLORS[k]}))">${o.m[k]}</span> ${nextName(o.month, k).toLowerCase()}da`).join(' + ');
  const th = (t, tip) => `<th class="px-2 font-semibold" title="${tip}">${t}</th>`;
  return salesKanban(list) + `<details class="mt-6"><summary class="cursor-pointer text-sm text-muted hover:text-fg mb-3">Batafsil: har oy leadlari keyin qachon sotib olgan</summary>` + card(h3(`Leadlar qachon sotuvga aylanadi${S.source ? ' — ' + esc(S.source) : ''}`, "Har qator — bir oyda kelgan leadlar. <b>Shu oyda sotildi</b> — o'sha oyning o'zida sotib olganlar. <b>Keyingi oyga o'tdi</b> — o'sha oyda sotilmagan va yopilmagan leadlar (keyingi oylarda sotilganlar + hali jarayondagilar). <b>Keyingi oylarda sotildi</b> — o'sha leadlardan keyingi oylarda sotib olganlar. <b>Jami sotuv</b> = shu oyda + keyingi oylarda.") +
    `<div class="overflow-x-auto -mx-2"><table class="w-full text-sm border-separate" style="border-spacing:0"><thead><tr class="text-xs text-muted align-bottom">
      <th class="text-left px-2 py-2 font-semibold">Lead kelgan oy</th><th class="text-right px-2 font-semibold">Leadlar</th>${th('Shu oyda sotildi', "Lead kelgan oyning o'zida sotib olganlar")}${th("Keyingi oyga o'tdi", "Oy oxirigacha sotilmagan va yopilmagan leadlar")}${th('Keyingi oylarda sotildi', "Shu oy leadlaridan keyingi oylarda sotib olganlar")}${th('Jami sotuv', "Shu oyda + keyingi oylarda")}
      <th class="px-2 font-semibold">Shu oyning o'zida</th><th class="px-2 font-semibold">1 oydan keyin</th><th class="px-2 font-semibold">2 oydan keyin</th><th class="px-2 font-semibold">3+ oydan keyin</th></tr></thead>
      <tbody>${list.map(o => `<tr><td class="px-2 py-1 font-semibold whitespace-nowrap">${name(o.month)} ${o.month.slice(0, 4)}</td><td class="px-2 text-right tabular-nums">${num(o.leads)}</td>
        <td class="px-2">${bar(o.won_same_month, mx(x => x.won_same_month), 'green')}</td><td class="px-2">${bar(carried(o), mx(carried), 'amber')}</td>
        <td class="px-2">${bar(o.won_later, mx(x => x.won_later), 'teal')}</td><td class="px-2">${bar(o.won, mx(x => x.won), 'green', `${o.won} · ${pct(div(o.won, o.leads))}`)}</td>
        ${[0, 1, 2, 3].map(k => cell(o, k)).join('')}</tr>
        <tr><td></td><td colspan="9" class="px-2 pb-3 text-[11px] text-muted">Jami ${o.won} ta sotuv = ${split(o) || '0'}. Keyingi oyga o'tgan ${num(carried(o))} tadan ${o.won_later} tasi keyin sotib oldi, ${num(o.still_open)} tasi hali jarayonda.</td></tr>`).join('')}</tbody></table></div>` +
    `<p class="text-xs text-muted mt-2">«Sotuv» — Bitrix'da «Сделка успешна» bo'lgan deal. Iyuldan oldingi oylar to'liq yuklanmagan.</p>`) + '</details>';
}

// Objections heard in analysed calls of the selected dates, with how often such calls still ended booked.
function callObjections() {
  const ok = analysed(), by = {};
  for (const c of ok) for (const o of new Set((c.objections || []).map(x => x.toLowerCase().trim()))) { const r = by[o] ??= { o, n: 0, booked: 0 }; r.n++; r.booked += c.outcome === 'yozildi'; }
  const rows = Object.values(by).sort((a, b) => b.n - a.n).slice(0, 12);
  if (!rows.length) return '';
  return card(h3("Qo'ng'iroqlardagi e'tirozlar", `${num(ok.length)} ta tahlil qilingan qo'ng'iroqdan (tanlangan davr). «Yozildi» — e'tirozga qaramay sinov darsiga yozilganlar ulushi`) + table([
    { t: "E'tiroz", f: r => esc(r.o) }, { t: "Qo'ng'iroq", r: 1, f: r => bar(r.n, rows[0].n, 'rose', num(r.n)) }, { t: 'Yozildi', r: 1, f: r => pct(r.booked / r.n) },

function pains() {

      { t: "Og'riq", f: o => esc(o.p) }, { t: "Qo'ng'iroq", r: 1, s: o => o.n, f: o => bar(o.n, list[0].n, 'violet', num(o.n)) }, { t: 'Yozildi', r: 1, s: o => div(o.booked, o.n), f: o => pct(div(o.booked, o.n)) },

  </div>`]]);

// Lead loss reasons from Bitrix statuses: CRM-side objections, available without call analysis.

// All leads, stage by stage: lead statuses, then deal stages (C47 pipeline).
const STEPS = [['leads', 'Leadlar'], ['contacted', 'Aloqa qilindi'], ['qual', 'Sifatli'], ['deals', 'Deal ochildi'], ['came_to_branch', 'Filialga keldi'], ['won', 'Sotuv']];

function sumBy(rows, keyFn) {

    for (const [s] of STEPS) o[s] += +r[s];

}
const stepCell = (o, i) => { const v = o[STEPS[i][0]], prev = i ? o[STEPS[i - 1][0]] : null; return `${num(v)}${i ? `<div class="text-[10px] text-muted">${pct(div(v, prev))}</div>` : ''}`; };
// One line that ties the two sale counts together.
function wonGap(cohort, all) {

  return `<div class="mt-4 p-3 rounded-xl bg-surface2 text-[13px] leading-relaxed"><i class="ph-bold ph-info text-muted"></i> Shu davrda jami <b>${num(all)} ta sotuv</b> yopildi: <b>${num(cohort)} tasi</b> shu davr leadlaridan, <b>${num(older)} tasi</b> oldinroq kelgan leadlardan. «Sotuv sanasi» — hammasi, «Lid sanasi» — faqat shu davr leadlari.</div>`;
}
function funnel() {

// Every Bitrix stage (lead statuses and C47 deal stages) in kanban order.
const stageRow = (name, n, total, extra = '', tone = 'violet') => `<div class="text-sm"><div class="flex justify-between gap-3"><span class="min-w-0 truncate">${esc(name)}</span><span class="tabular-nums whitespace-nowrap">${num(n)} <span class="text-xs text-muted">· ${pct(div(n, total))}${extra}</span></span></div><div class="h-1.5 bg-surface2 rounded-full mt-1"><div class="h-1.5 rounded-full" style="width:${Math.max(div(n, total) * 100, 0.5).toFixed(1)}%;background:rgb(var(--c-${tone}) / .7)"></div></div></div>`;

// When leads arrive and from which phone operator codes (Tashkent time).
const OPERATORS = { 90: 'Beeline', 91: 'Beeline', 92: 'Beeline', 20: 'Beeline (OQ)', 93: 'Ucell', 94: 'Ucell', 50: 'Ucell', 97: 'Mobiuz', 88: 'Mobiuz', 87: 'Mobiuz',
  99: 'Uzmobile', 77: 'Uzmobile', 95: 'Uzmobile', 70: 'Uzmobile', 55: 'Uzmobile', 33: 'Humans', 98: 'Perfectum', 80: 'Perfectum' };
const operatorOf = code => OPERATORS[code] || (code === "yo'q" ? "Raqam yo'q" : code === 'boshqa' ? "Xorijiy / noto'g'ri format" : "Noma'lum kod");

  const blank = key => ({ key, leads: 0, qual: 0, won: 0, unreached: 0 });

    { t: 'Sifatli', r: 1, f: o => num(o.qual) }, { t: 'Sifat %', r: 1, f: o => chip(pct(div(o.qual, o.leads)), div(o.qual, o.leads) >= avgQual ? 'success' : 'danger'), s: o => div(o.qual, o.leads) ?? -1 },
    { t: 'Sotuv', r: 1, f: o => num(o.won) }, { t: 'Sotuv %', r: 1, f: o => pct(div(o.won, o.leads)), s: o => div(o.won, o.leads) ?? -1 },

// What the hour/weekday/operator data says, each with the step that fixes it.
function leadFindings(hours, H, ops, total, avgQual) {
  const sum = (xs, k) => xs.reduce((a, o) => a + o[k], 0);
  const night = hours.filter(o => o.key >= 20 || o.key < 9), day = hours.filter(o => o.key >= 9 && o.key < 20);
  const nUnr = div(sum(night, 'unreached'), sum(night, 'leads')), dUnr = div(sum(day, 'unreached'), sum(day, 'leads'));
  const nQual = div(sum(night, 'qual'), sum(night, 'leads')), dQual = div(sum(day, 'qual'), sum(day, 'leads'));
  const rated = hours.filter(o => o.leads >= 8).map(o => ({ ...o, q: div(o.qual, o.leads) })).sort((a, b) => b.q - a.q);
  const hh = o => `${String(o.key).padStart(2, '0')}:00`;
  const wd = {}; for (const r of H) { const k = (new Date(r.day + 'T00:00').getDay() + 6) % 7; const o = wd[k] ??= { k, leads: 0, qual: 0 }; o.leads += +r.leads; o.qual += +r.qual; }
  const DOW = ['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba', 'Yakshanba'];
  const wds = Object.values(wd).filter(o => o.leads >= 15).map(o => ({ ...o, q: div(o.qual, o.leads) })).sort((a, b) => b.q - a.q);
  const opWorst = Object.values(ops).filter(o => o.leads >= 20).map(o => ({ ...o, u: div(o.unreached, o.leads) })).sort((a, b) => b.u - a.u)[0];
  const items = [];
  if (sum(night, 'leads') >= 10) items.push(['ph-moon', nUnr > dUnr ? 'rose' : 'teal', `Kechki leadlar (20:00–09:00): ${pct(div(sum(night, 'leads'), total))}`,
    `Bog'lanib bo'lmadi: kechasi ${pct(nUnr)}, kunduzi ${pct(dUnr)}. Sifatli: kechasi ${pct(nQual)}, kunduzi ${pct(dQual)}.`,
    nUnr > dUnr ? "Kechki leadlarga darhol avtomatik Telegram/SMS xabar yuboring («Ertalab 9:00 da qo'ng'iroq qilamiz») va ertalab birinchi soatda faqat ularga qo'ng'iroq qiling." : "Kechki leadlar kunduzgidan yomon emas — ertalab 9:00 dagi navbatni saqlang."]);
  if (rated.length >= 4) items.push(['ph-clock', 'green', `Eng sifatli soatlar: ${rated.slice(0, 3).map(hh).join(', ')}`,
    `Sifatli ulushi ${rated.slice(0, 3).map(o => pct(o.q)).join(', ')} (o'rtacha ${pct(avgQual)}). Eng past: ${rated.slice(-3).map(o => `${hh(o)} ${pct(o.q)}`).join(', ')}.`,
    "Meta'da reklama jadvalini (ad scheduling, lifetime budget bilan) shu soatlarga ko'proq yo'naltiring; past soatlarda qo'ng'iroq qilish tezligini tekshiring."]);
  if (wds.length >= 4) items.push(['ph-calendar', 'violet', `Eng yaxshi kun: ${DOW[wds[0].k]} (${pct(wds[0].q)}), eng yomoni: ${DOW[wds[wds.length - 1].k]} (${pct(wds[wds.length - 1].q)})`,
    `Hafta kunlari bo'yicha sifatli lead ulushi.`, "Byudjetni yomon kunlarda biroz kamaytirib, yaxshi kunlarga o'tkazing; yomon kunda menejerlar soni yetarlimi — tekshiring."]);
  if (opWorst && opWorst.u > 0) items.push(['ph-phone-x', 'amber', `Eng ko'p «bog'lanib bo'lmadi»: ${opWorst.key} raqamlari (${pct(opWorst.u)})`,
    `${num(opWorst.leads)} ta lead shu operatordan.`, "Bu raqamlarga qo'ng'iroqdan oldin Telegram orqali yozish yoki boshqa vaqtda qayta urinish qoidasini qo'ying."]);
  if (!items.length) return '';
  return card(h3('Nima topildi va nima qilish kerak', "Avtomatik xulosa: tanlangan davrdagi leadlar soat, hafta kuni va telefon operatori bo'yicha.") +
    `<div class="grid md:grid-cols-2 gap-3">${items.map(([icon, tone, title, fact, action]) => `<div class="rounded-2xl bg-surface2 p-4"><div class="flex items-center gap-2 text-[13px] font-semibold"><i class="ph-bold ${icon}" style="color:rgb(var(--c-${tone}))"></i>${title}</div><div class="text-[12px] text-muted mt-1">${fact}</div><div class="text-[12.5px] mt-2"><i class="ph-bold ph-arrow-right text-accent"></i> ${action}</div></div>`).join('')}</div>`, 'mb-6');
}

const WD = ['Ya', 'Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh'];
function daily() {
  const rows = S.data.daily;
  if (!rows.length) return card(empty("Tanlangan davrda lead yo'q"));
  const bySrc = groupSum(rows, r => channelOf(r.source)).sort((a, b) => b.leads - a.leads);
  const [tot] = groupSum(rows, () => 'all');
  // Sales come from the same list as every other screen (date rule in the bar above).
  const soldCh = countBy(salesList(true), p => channelOf(p.source));
  for (const o of bySrc) o.won = soldCh[o.key]?.n || 0;
  for (const k in soldCh) if (!bySrc.some(o => o.key === k)) bySrc.push({ key: k, ...Object.fromEntries(OUT.map(([x]) => [x, 0])), revenue: 0, won: soldCh[k].n });
  tot.won = salesList(true).length; tot._foot = true;
  const view = 'day', picked = S.source;
  const rate = (o, k) => div(o[k], o.leads);
  // Findings only from sources with enough leads to mean something.
  const big = bySrc.filter(o => o.leads >= 10);
  const pick = (k, dir) => [...big].sort((a, b) => dir * ((rate(b, k) ?? -1) - (rate(a, k) ?? -1)))[0];
  const finding = (icon, tone, title, o, k, what) => o ? `<div class="rounded-2xl bg-surface2 p-3.5"><div class="flex items-center gap-2 text-[12px] font-semibold" style="color:rgb(var(--c-${tone}))"><i class="ph-bold ${icon}"></i>${title}</div><div class="mt-1 text-[14px] font-semibold">${esc(o.key)} — ${pct(rate(o, k))}</div><div class="text-[11.5px] text-muted mt-0.5">o'rtacha ${pct(rate(tot, k))} · ${num(o.leads)} lead. ${what}</div></div>` : '';
  const findings = big.length < 2 ? '' : `<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
    ${finding('ph-star', 'teal', 'Eng sifatli manba', pick('qual', 1), 'qual', "Byudjet/e'tiborni shu manbaga ko'paytiring.")}
    ${finding('ph-trophy', 'green', 'Sotuvga eng yaxshi', pick('won', 1), 'won', "Shu manba leadlariga birinchi navbatda qo'ng'iroq.")}
    ${finding('ph-trash', 'rose', "Eng ko'p sifatsiz", pick('junk', 1), 'junk', "Forma savollari yoki auditoriyani tekshiring.")}
    ${finding('ph-hourglass', 'amber', 'Eng ko\'p hal qilinmagan', pick('in_progress', 1), 'in_progress', "Bu leadlar hali ochiq — menejerlar qayta aloqa qilsin.")}</div>`;
  const cell = (n, of) => `${num(n)} <span class="text-[11px] text-muted">${pct(div(n, of))}</span>`;
  const cols = (label, keyCell) => [{ t: label, f: r => r._foot ? '<b>Jami</b>' : keyCell(r), s: r => r.key },
    { t: 'Leadlar', r: 1, s: r => r.leads, f: r => num(r.leads) },
    { t: 'Aloqa', r: 1, s: r => rate(r, 'contacted') ?? -1, f: r => cell(r.contacted, r.leads) },
    { t: 'Sifatli', r: 1, s: r => rate(r, 'qual') ?? -1, f: r => r._foot ? cell(r.qual, r.leads) : `${num(r.qual)} ${chip(pct(rate(r, 'qual')), (rate(r, 'qual') ?? 0) >= (rate(tot, 'qual') ?? 0) ? 'success' : 'danger')}` },
    { t: 'Filialga keldi', r: 1, s: r => r.came_to_branch, f: r => num(r.came_to_branch) },
    { t: 'Sotuv', r: 1, s: r => rate(r, 'won') ?? -1, f: r => cell(r.won, r.leads) },
    { t: 'Jarayonda', r: 1, s: r => r.in_progress, f: r => num(r.in_progress) },
    { t: 'Sifatsiz', r: 1, s: r => rate(r, 'junk') ?? -1, f: r => cell(r.junk, r.leads) }];
  const seg = `<div class="inline-flex p-1 bg-surface2 rounded-xl text-xs font-semibold">${[['src', 'Manbalar'], ['day', 'Kunlar']].map(([k, t]) => `<button onclick="S.dailyView='${k}';render()" class="px-3 h-7 rounded-lg ${view === k ? 'bg-surface shadow-sm text-fg' : 'text-muted hover:text-fg'}">${t}</button>`).join('')}</div>`;
  const srcSelect = `<select onchange="S.source=this.value;render()" class="h-9 px-2 rounded-xl bg-surface2 border border-line text-sm"><option value="">Barcha kanallar</option>${bySrc.map(o => `<option ${o.key === picked ? 'selected' : ''} value="${esc(o.key)}">${esc(o.key)} (${num(o.leads)})</option>`).join('')}</select>`;
  const body = view === 'src'
    ? table(cols('Kanal', r => `<button data-c="${esc(r.key)}" onclick="S.source=this.dataset.c;S.dailyView='day';render()" class="font-semibold hover:text-accent text-left">${esc(r.key)}</button>`), bySrc, tot)
    : (() => { const ds = groupSum(bySource(rows), r => r.day).sort((a, b) => b.key.localeCompare(a.key)); const [t2] = groupSum(bySource(rows), () => 'all');
      const soldDay = countBy(salesList(), p => p.mday); for (const o of ds) o.won = soldDay[o.key]?.n || 0; if (t2) { t2.won = salesList().length; t2._foot = true; }
      return table(cols('Sana', r => `<span class="font-semibold tabular-nums">${r.key.slice(8)}.${r.key.slice(5, 7)}</span> <span class="text-xs text-muted">${WD[new Date(r.key + 'T00:00').getDay()]}</span>`), ds, t2); })();
  return card(`<div class="flex flex-wrap items-center gap-3 mb-4">${srcSelect}</div>` +
    h3(view === 'src' ? 'Kanallar: qaysi kanal sifatli lead va sotuv beradi' : `Kunlar${picked ? ' — ' + esc(picked) : ''}: qaysi kun leadlari yaxshi ishlandi`,
      "Lead kelgan kun bo'yicha. Foizlar — o'sha qatordagi leadlardan. Yashil/qizil — o'rtachadan yuqori/past. Kanal nomini bosing — o'sha kanalning kunlari ochiladi.") + findings + body);
}

const moneyShort = n => n == null ? '—' : Math.abs(n) >= 1e9 ? (n / 1e9).toFixed(2) + ' mlrd' : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1) + ' mln' : num(n);
function moneyPage() {
  const d = S.data, days = d.cycle.map(r => +r.days).sort((a, b) => a - b);
  const kpi = (l, v, sub, color) => `<div class="bg-surface border border-line rounded-2xl p-4 relative overflow-hidden"><div class="absolute inset-x-0 top-0 h-1" style="background:rgb(var(--c-${color}))"></div><div class="text-xs text-muted">${l}</div><div class="text-xl font-bold mt-1 tabular-nums">${v}</div>${sub ? `<div class="text-[11px] text-muted mt-0.5">${sub}</div>` : ''}</div>`;
  const tot = d.money.reduce((a, r) => ({ deals: a.deals + +r.deals, won: a.won + +r.won, lost: a.lost + +r.lost, amount: a.amount + +r.amount, paid: a.paid + +r.paid_amount, rem: a.rem + +(r.remaining || 0) }), { deals: 0, won: 0, lost: 0, amount: 0, paid: 0, rem: 0 });
  const q = f => days.length ? days[Math.min(days.length - 1, Math.floor(f * (days.length - 1)))] : null;
  const avg = days.length ? days.reduce((a, b) => a + b, 0) / days.length : null;
  const fmtD = v => v == null ? '—' : v < 1 ? Math.round(v * 24) + ' soat' : v.toFixed(1).replace('.0', '') + ' kun';
  // Sales cycle: min / median / average / max as bars, plus a distribution.
  const stats = [['Eng tez', q(0), 'green'], ['Mediana (yarmi shundan tez)', q(0.5), 'teal'], ["O'rtacha", avg, 'blue'], ['Eng uzoq', q(1), 'rose']];
  const maxD = Math.max(1, ...stats.map(x => x[1] || 0));
  const buckets = [['Shu kuni', 0, 1], ['1–3 kun', 1, 4], ['4–7 kun', 4, 8], ['8–14 kun', 8, 15], ['15–30 kun', 15, 31], ['31–60 kun', 31, 61], ['60+ kun', 61, 1e9]].map(([l, a, b]) => [l, days.filter(x => x >= a && x < b).length]);
  const maxB = Math.max(1, ...buckets.map(b => b[1]));
  const cum = []; buckets.reduce((acc, [, n]) => { cum.push(acc + n); return acc + n; }, 0);
  const tile = (l, v, sub) => `<div class="rounded-xl bg-surface2 border border-line p-4"><div class="text-xs text-muted">${l}</div><div class="text-2xl font-bold tabular-nums mt-1">${v}</div><div class="text-[11px] text-muted mt-0.5">${sub}</div></div>`;
  const cycleCard = card(h3('Sotuv sikli — leaddan sotuvgacha necha kun', `Tanlangan davrda kelgan leadlardan ${num(days.length)} ta sotuv. Hisob: lead tushgan kundan deal «Сделка успешна» bo'lgan kungacha.`) +
    (days.length ? `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${tile('Mediana', fmtD(q(0.5)), 'sotuvlarning yarmi shundan tezroq')}${tile("O'rtacha", fmtD(avg), "uzoq sotuvlar o'rtachani oshiradi")}${tile('Eng tez', fmtD(q(0)), 'birinchi kunning o\'zida')}${tile('Eng uzoq', fmtD(q(1)), 'eng sekin sotuv')}</div>` +
      table([
        { t: 'Lead kelganidan keyin', f: o => `<b>${o.l}</b>` },
        { t: 'Sotuvlar', r: 1, s: o => o.n, f: o => bar(o.n, maxB, 'violet') },
        { t: 'Ulushi', r: 1, s: o => o.n, f: o => pct(div(o.n, days.length)) },
        { t: 'Shu muddatgacha jami', r: 1, s: o => o.c, f: o => `${num(o.c)} <span class="text-xs text-muted">${pct(div(o.c, days.length))}</span>` },
      ], buckets.map(([l, n], i) => ({ l, n, c: cum[i] })))
      : empty("Tanlangan davr leadlaridan hali sotuv yo'q")), 'mb-6');
  // Deals and money by stage.
  const st = {}; for (const r of d.money) { const o = st[r.stage_name] ??= { key: r.stage_name, sort: r.sort, deals: 0, lost: 0, won: 0, amount: 0, paid: 0, rem: 0, wonAmount: 0, openAmount: 0 }; if (+r.won) o.wonAmount += +r.amount; else if (!+r.lost) o.openAmount += +r.amount; o.deals += +r.deals; o.lost += +r.lost; o.won += +r.won; o.amount += +r.amount; o.paid += +r.paid_amount; o.rem += +(r.remaining || 0); }
  const stList = Object.values(st).sort((a, b) => a.sort - b.sort), mx = k => Math.max(0, ...stList.map(o => o[k]));
  const stageTable = table([
    { t: 'Deal stadiyasi', f: o => o._foot ? 'Jami' : `<span class="font-semibold">${esc(o.key)}</span>`, s: o => o.sort },
    { t: 'Deallar', r: 1, s: o => o.deals, f: o => o._foot ? num(o.deals) : bar(o.deals, mx('deals'), 'blue') },
    { t: 'Rad etildi', r: 1, s: o => o.lost, f: o => o._foot ? num(o.lost) : bar(o.lost, mx('lost'), 'rose') },
    { t: 'Sotuv', r: 1, s: o => o.won, f: o => o._foot ? num(o.won) : bar(o.won, mx('won'), 'green') },
    { t: 'Deal summasi', r: 1, s: o => o.amount, f: o => moneyShort(o.amount) },
    ...(tot.paid > 0 ? [{ t: "To'langan", r: 1, s: o => o.paid, f: o => o._foot ? moneyShort(o.paid) : bar(o.paid, mx('paid'), 'teal', moneyShort(o.paid)) },
    { t: 'Qoldiq (qarz)', r: 1, s: o => o.rem, f: o => o._foot ? moneyShort(o.rem) : bar(o.rem, mx('rem'), 'amber', moneyShort(o.rem)) }] : []),
  ], stList, { _foot: true, deals: tot.deals, lost: tot.lost, won: tot.won, amount: tot.amount, paid: tot.paid, rem: tot.rem });
  const lr = {}; for (const r of d.lostReasons) lr[r.reason] = (lr[r.reason] || 0) + +r.deals;
  const lrList = Object.entries(lr).map(([key, n]) => ({ key, n })).sort((a, b) => b.n - a.n), lrAll = lrList.reduce((a, o) => a + o.n, 0), lrMax = Math.max(0, ...lrList.map(o => o.n));
  const hasPaid = tot.paid > 0, wonSum = stList.reduce((a, o) => a + o.wonAmount, 0), openSum = stList.reduce((a, o) => a + o.openAmount, 0);
  const note = hasPaid ? '' : `<div class="mb-6 text-xs rounded-xl border border-line bg-surface2 px-4 py-3 text-muted"><b class="text-fg">To'lovlar Bitrix'da yuritilmayapti:</b> «Всего оплачено» va «Дата первой оплаты» maydonlari bo'sh. Shuning uchun summa — sotilgan deallarning «Сумма» maydoni, sikl — deal yopilgan sana bo'yicha. Aniq to'lovlar uchun to'lov tizimini (masalan, Hollyhop) ulash kerak.</div>`;
  return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      ${hasPaid ? kpi("To'langan", moneyShort(tot.paid) + " so'm", `${num(tot.won)} ta sotuv`, 'teal') : kpi('Sotuvlar summasi', moneyShort(wonSum) + " so'm", `${num(tot.won)} ta sotuv · deal summasi`, 'green')}
      ${hasPaid ? kpi('Qoldiq (qarz)', moneyShort(tot.rem) + " so'm", "to'lanmagan qism", 'amber') : kpi('Jarayondagi deallar', moneyShort(openSum) + " so'm", "hali yopilmagan deallar summasi", 'amber')}
      ${kpi("O'rtacha chek", moneyShort(div(hasPaid ? tot.paid : wonSum, tot.won)) + " so'm", hasPaid ? "to'langan / sotuvlar" : 'sotuv summasi / sotuvlar', 'blue')}${kpi('Sotuv sikli (mediana)', fmtD(q(0.5)), `o'rtacha ${fmtD(avg)}`, 'violet')}
    </div>` + note + sections('money', [['c', 'Sotuv sikli', () => cycleCard],
    ['s', 'Deal stadiyalari', () => card(h3("Deallar stadiya bo'yicha", "Tanlangan davrda ochilgan deallar, hozirgi stadiyasi bo'yicha. Summa — deal «Сумма» maydoni.") + stageTable, 'mb-6')],
    ['l', 'Nega sotib olmadi', () => card(h3('Nega sotib olmadi', "Yopilgan (провалена) deallar, Bitrix'dagi sabab maydonidan") + (lrList.length && !(lrList.length === 1 && lrList[0].key.startsWith('Sabab')) ? `<div class="space-y-1.5">${lrList.map(o => `<div class="grid grid-cols-[minmax(0,1fr)_minmax(0,1.4fr)] items-center gap-3 text-sm"><span class="truncate">${esc(o.key)}</span>${bar(o.n, lrMax, o.key.startsWith('Sabab') ? 'crimson' : 'rose', `${o.n} · ${pct(div(o.n, lrAll))}`)}</div>`).join('')}</div>` : `<div class="text-sm text-muted py-4">${num(lrAll)} ta deal yopilgan, lekin Bitrix'dagi «Nega sotib olmadi?» / «Sotib olmaganini sababi» maydoni hech birida to'ldirilmagan. Menejerlar shu maydonni majburiy to'ldirsa, bu yerda sabablar chiqadi. Hozircha leadlar bo'yicha sabablar «Voronka» bo'limida.</div>`))]]);
}

const BX_LEAD = id => `https://robbit.bitrix24.kz/crm/lead/details/${id}/`;

const scoreChip = n => chip(n == null ? '—' : n, scoreTone(n));
const avgOf = (rows, f) => { const xs = rows.map(f).filter(v => v != null && isFinite(v)); return xs.length ? xs.reduce((a, b) => a + +b, 0) / xs.length : null; };
const go = (op, call) => `onclick="S.op=${op == null ? 'null' : `'${esc(String(op)).replace(/'/g, "\\'")}'`};S.call=${call == null ? 'null' : `'${esc(call)}'`};render();scrollTo(0,0)"`;
const crumbs = (...parts) => `<div class="flex flex-wrap items-center gap-1.5 text-[13px] text-muted mb-4">${parts.map(([t, on]) => on ? `<button ${on} class="hover:text-fg underline-offset-2 hover:underline">${t}</button>` : `<span class="text-fg font-semibold">${t}</span>`).join('<i class="ph-bold ph-caret-right text-[10px]"></i>')}</div>`;
const kpiTile = (l, v, sub, color) => `<div class="bg-surface rounded-3xl p-5"><div class="text-[11px] font-semibold tracking-wide uppercase" style="color:rgb(var(--c-${color}))">${l}</div><div class="text-[28px] leading-tight font-bold mt-1 tabular-nums">${v}</div>${sub ? `<div class="text-[11px] text-muted mt-1">${sub}</div>` : ''}</div>`;
const analysed = () => (S.data.calls || []).filter(r => r.rubric);
const isSale = c => !c.call_type || c.call_type === 'sotuv';

// One row per manager for the selected dates: CRM outcomes + call scores.
function managerRows() {
  const by = {};
  for (const r of S.data.operators || []) {
    const k = normName(r.operator), o = by[k] ??= { key: k, name: String(r.operator).split('|')[0].trim(), leads: 0, contacted: 0, qual: 0, came: 0, won: 0, junk: 0, calls: [] };
    o.leads += +r.leads || 0; o.contacted += +r.contacted || 0; o.qual += +r.qual || 0; o.came += +r.came_to_branch || 0; o.won += +r.won || 0; o.junk += +r.junk || 0;
  }
  for (const c of analysed()) {
    const n = opNameOf(c.operator_id), k = normName(n);
    (by[k] ??= { key: k, name: n, leads: 0, contacted: 0, qual: 0, came: 0, won: 0, junk: 0, calls: [] }).calls.push(c);
  }
  return Object.values(by).filter(o => !isHiddenUser(o.name)).map(o => { const sales = o.calls.filter(isSale); return { ...o, sales, total: avgOf(sales, c => c.total), stages: Object.fromEntries(RUBRIC.map(([st]) => [st, avgOf(sales, c => c.stages?.[st])])) }; });
}

    ${card(h3("Qo'ng'iroqlar", "Bosing — to'liq tahlil, mezonlar va dialog") + callList(calls))}`;

// Dialog as chat bubbles: customer left, operator right, recorded voice (IVR) centred.
function dialog(text) {
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return empty("Dialog yo'q");
  return `<div class="flex flex-col gap-2 text-[13px] leading-relaxed">${lines.map(l => {
    const m = l.match(/^(Operator|Mijoz|Avtojavob)\s*:\s*(.*)$/i), who = m ? m[1].toLowerCase() : '', t = esc(m ? m[2] : l);
    if (who === 'avtojavob') return `<div class="self-center text-[11.5px] text-muted italic px-3 py-1 rounded-full bg-surface2">🔊 ${t}</div>`;
    if (who === 'operator') return `<div class="self-end max-w-[80%] rounded-2xl rounded-br-sm px-3.5 py-2" style="background:rgb(var(--accent) / .16)"><div class="text-[10.5px] font-semibold text-accent mb-0.5">Operator</div>${t}</div>`;
    return `<div class="self-start max-w-[80%] rounded-2xl rounded-bl-sm px-3.5 py-2 bg-surface2"><div class="text-[10.5px] font-semibold text-muted mb-0.5">Mijoz</div>${t}</div>`;
  }).join('')}</div>`;
}
// Recording is streamed by the call-audio function with the admin's session.
async function playCall(id) {
  const box = $('aud'); box.innerHTML = '<span class="text-sm text-muted">Yozuv yuklanmoqda…</span>';
  try {
    const { data } = await sbc.auth.getSession();
    const res = await fetch(`${SB_URL}/functions/v1/call-audio?id=${encodeURIComponent(id)}`, { headers: { authorization: `Bearer ${data.session?.access_token}`, apikey: SB_KEY } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    box.innerHTML = `<audio controls autoplay class="w-full" src="${URL.createObjectURL(await res.blob())}"></audio>`;
  } catch (e) { box.innerHTML = `<span class="text-sm text-danger">Yozuvni ochib bo'lmadi: ${esc(e.message)}</span>`; }
}
async function requeueCall(id) {
  const { error } = await sbc.rpc('requeue_call', { p_call_id: id });
  alert(error ? 'Xato: ' + error.message : "Navbatga qo'yildi — AI 5–10 daqiqada qayta tahlil qiladi (sahifani keyin yangilang).");
}

// AI review of Bitrix call recordings (call-analyze edge function, Gemini free tier), for the selected dates.
function calls() {
  if (S.callsBusy) return card(empty("Qo'ng'iroqlar yuklanmoqda…"));
  if (S.call) return callDetail();
  const all = S.data.calls || [], ok = analysed(), sales = ok.filter(isSale);
  const queued = all.filter(r => !r.rubric && !r.error).length, failed = all.filter(r => !r.rubric && r.error).length;
  const F = S.callF ||= { type: 'sotuv', low: false };
  const top = (xs, k, n = 8) => Object.entries(xs.flatMap(r => r[k] || []).reduce((m, x) => (m[x.toLowerCase()] = (m[x.toLowerCase()] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]).slice(0, n);
  const list = (t, sub, rows, color) => card(h3(t, sub) + (rows.length ? rows.map(([x, n]) => `<div class="flex items-center justify-between gap-3 py-1.5 border-b border-line/60 last:border-0 text-[13px]"><span>${esc(x)}</span>${bar(n, rows[0][1], color, num(n))}</div>`).join('') : empty("Ma'lumot yo'q")));
  const booked = sales.filter(r => r.outcome === 'yozildi').length;
  // Team average per script stage: where points are lost.
  const stages = RUBRIC.map(([st, t]) => ({ st, t, v: avgOf(sales, c => c.stages?.[st]) })).filter(x => x.v != null);
  const weakest = [...stages].sort((a, b) => a.v - b.v)[0];
  const mgrs = managerRows().filter(r => r.sales.length).map(r => ({ ...r, booked: div(r.sales.filter(c => c.outcome === 'yozildi').length, r.sales.length) })).sort((a, b) => (a.total ?? 101) - (b.total ?? 101));
  const weakStage = r => { const e = Object.entries(r.stages).filter(([, v]) => v != null).sort((a, b) => a[1] - b[1])[0]; return e ? RUBRIC.find(x => x[0] === e[0])[1] : '—'; };
  let shown = F.type === 'sotuv' ? sales : ok;
  if (F.low) shown = shown.filter(c => c.total != null && c.total < 50);
  const seg = (items, cur, set) => `<div class="inline-flex p-1 bg-surface2 rounded-xl text-xs font-semibold">${items.map(([k, t]) => `<button onclick="${set.replace('$', k)}" class="px-3 h-7 rounded-lg ${cur === k ? 'bg-surface shadow-sm text-fg' : 'text-muted hover:text-fg'}">${t}</button>`).join('')}</div>`;

  <div class="mb-6">

async function saveCourses() {

async function askAI(text) {
  text = String(text || '').trim(); if (!text || S.aiBusy) return;
  S.ai.push({ role: 'user', content: text }); S.aiBusy = true; render();
  const { data, error } = await sbc.functions.invoke('ai-chat', { body: { from: S.from, to: S.to, messages: S.ai.filter(m => !m.error).map(({ role, content }) => ({ role, content })) } });
  let msg = data?.error || null;
  if (error && !msg) { try { msg = (await error.context.json()).error; } catch { msg = error.message; } }
  S.ai.push(msg ? { role: 'assistant', content: msg, error: true } : { role: 'assistant', content: data.answer });
  S.aiBusy = false; render(); scrollTo(0, document.body.scrollHeight);
}

const fmtM = (v, f) => v == null || !isFinite(v) ? '—' : f === 'usd' ? '$' + (+v).toFixed(2) : f === 'pct' ? pct(v) : f === 'dec' ? (+v).toFixed(1) : f === 'min' ? (+v).toFixed(1) + ' daq' : num(v);
// Saved rows + live rows for days not saved yet (today), newest first.
function dmRows() {
  const saved = Object.fromEntries((S.data.dm || []).map(r => [r.day, r]));
  for (const r of S.data.dmLive || []) if (!saved[r.day]) saved[r.day] = { ...r, live: true };
  return Object.values(saved).sort((a, b) => b.day.localeCompare(a.day));
}
async function saveNote(day, el) {
  const { error } = await sbc.from('daily_metrics').update({ note: el.value }).eq('day', day);
  el.style.borderColor = error ? 'rgb(var(--danger))' : 'rgb(var(--success))';
  const r = (S.data.dm || []).find(x => x.day === day); if (r && !error) r.note = el.value;
}
function metricsPage() {
  const all = dmRows(), rows = all.filter(r => r.day >= S.from && r.day <= S.to);
  if (!rows.length) return card(empty("Bu davr uchun saqlangan kun yo'q"));
  const prev = r => all[all.indexOf(r) + 1];
  const delta = (r, [, , f, , better]) => {
    const p = prev(r); if (!p || !better) return '';
    const a = f(r), b = f(p); if (a == null || b == null || !isFinite(a) || !isFinite(b) || !b) return '';
    const d = (a - b) / Math.abs(b); if (Math.abs(d) < 0.005) return '';
    const good = d * better > 0;
    return `<div class="text-[10.5px] ${good ? 'text-success' : 'text-danger'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d * 100).toFixed(0)}%</div>`;
  };
  // Range totals (ratios recomputed from sums, first-call minutes averaged over days).
  const sum = k => rows.reduce((a, r) => a + (+r[k] || 0), 0);
  const tot = { spend: sum('spend'), impressions: sum('impressions'), clicks: sum('clicks'), meta_leads: sum('meta_leads'), ad_leads: sum('ad_leads'), all_leads: sum('all_leads'), unreachable: sum('unreachable'), qual: sum('qual'), first_call_min: avgOf(rows, r => r.first_call_min) }; // days' medians averaged
  const cell = 'px-3 py-2 text-right tabular-nums whitespace-nowrap';

// ---- Branches: leads, quality, Meta spend and where each source's leads were handed.

  const list = Object.values(by).sort((a, b) => b.tot - a.tot), max = Math.max(1, ...list.flatMap(o => branches.map(b => o[b] || 0)));
  const cell = (n, q, tot) => n ? `<div class="rounded-lg px-2 py-1" style="background:rgb(var(--c-blue) / ${(0.06 + 0.5 * n / max).toFixed(2)})"><div class="font-semibold">${num(n)}</div><div class="text-[10.5px] text-muted">${pct(n / tot)}${sub ? ` · ${num(q)} sif.` : ''}</div></div>` : '<span class="text-muted/50">·</span>';
  return `<div class="overflow-x-auto -mx-4 sm:-mx-5"><table class="w-full text-[12.5px]"><thead><tr class="text-[11px] text-muted border-b border-line"><th class="px-3 py-2 text-left sticky left-0 bg-surface">${rowKey === 'source' ? 'Manba' : 'Kampaniya'}</th><th class="px-3 py-2 text-right">Jami</th>${branches.map(b => `<th class="px-2 py-2 text-right font-semibold">${esc(b)}</th>`).join('')}</tr></thead><tbody>
    ${list.map(o => `<tr class="border-b border-line/50"><td class="px-3 py-1.5 sticky left-0 bg-surface max-w-[260px] truncate" title="${esc(o.key)}">${esc(o.key)}</td><td class="px-3 py-1.5 text-right tabular-nums font-semibold">${num(o.tot)}<div class="text-[10.5px] text-muted font-normal">${num(o.qual)} sifatli</div></td>${branches.map(b => `<td class="px-1.5 py-1 text-right tabular-nums">${cell(o[b] || 0, o['q:' + b] || 0, o.tot)}</td>`).join('')}</tr>`).join('')}
    </tbody><tfoot><tr class="border-t-2 border-line font-semibold bg-surface2/50"><td class="px-3 py-2 sticky left-0 bg-surface2">Jami</td><td class="px-3 py-2 text-right tabular-nums">${num(list.reduce((a, o) => a + o.tot, 0))}</td>${branches.map(b => `<td class="px-2 py-2 text-right tabular-nums">${num(colTot[b] || 0)}</td>`).join('')}</tr></tfoot></table></div>`;
}
function branchesPage() {

  for (const r of lead) { const o = row(r.branch); for (const k of ['leads', 'qual', 'unreachable', 'came', 'paid', 'won', 'revenue']) o[k] += +r[k] || 0;
    if (isT(r)) { o.t_leads += +r.leads; o.t_qual += +r.qual; o.t_unr += +r.unreachable; o.t_won += +r.won; } }

  const med = xs => { const a = xs.map(Number).sort((x, y) => x - y); return a.length ? (a.length % 2 ? a[(a.length - 1) / 2] : (a[a.length / 2 - 1] + a[a.length / 2]) / 2) : null; };

  const group = (key, name) => Object.values(all.reduce((m, r) => { const k = r[key] ?? '—'; const o = m[k] ??= { k, name: name(k), n: 0, xs: [], none: 0 }; o.n++; if (r.minutes != null) o.xs.push(+r.minutes); else if (!r.first_call_at) o.none++; return m; }, {}))

  const cols = first => [{ t: first, f: r => esc(r.name) }, { t: 'Leadlar', r: 1, f: r => num(r.n) }, { t: "O'rtacha", r: 1, f: r => fm(r.avg) }, { t: 'Mediana', r: 1, f: r => fm(r.med) }, { t: '5 daq ichida', r: 1, f: r => pct(r.in5) }, { t: "Qo'ng'iroq qilinmagan", r: 1, f: r => r.none ? chip(num(r.none), 'danger') : '0' }];

// Plain-language median plus how many leads waited how long, so the KPI is easy to check.
function speedExplain(called, notCalled, all, med, fm) {
  const m = med(called.map(r => r.minutes)), avg = avgOf(called, r => +r.minutes);
  const B = [['5 daqiqagacha', 0, 5, 'green'], ['5–15 daqiqa', 5, 15, 'teal'], ['15–30 daqiqa', 15, 30, 'amber'], ['30–60 daqiqa', 30, 60, 'amber'], ['1–3 soat', 60, 180, 'rose'], ['3 soatdan ko\'p', 180, Infinity, 'rose']];
  const rows = B.map(([t, lo, hi, c]) => ({ t, c, n: called.filter(r => +r.minutes > lo - (lo ? 0 : 1) && +r.minutes <= hi).length }));
  rows.push({ t: "Qo'ng'iroq qilinmagan", c: 'crimson', n: notCalled.length });
  const max = Math.max(1, ...rows.map(r => r.n));

      <p><b>O'rtacha = ${fm(avg)}.</b> Bir nechta juda kech qo'ng'iroq (masalan, ertasi kuni) o'rtachani ko'tarib yuboradi. Shuning uchun asosiy ko'rsatkich — mediana: u «odatdagi» leadni ko'rsatadi.</p>
      <p><b>Ish vaqti bo'yicha</b> hisoblanadi: lead 20:00–09:00 orasida kelsa, kutish ertalab 09:00 dan sanaladi (operator tunda ishlamaydi). Soat bo'yicha (tun ham hisoblanganda) qiymat KPI kartochkasi ostida yozilgan.</p>
      <p class="text-muted text-[12.5px]">Maqsad: mediana 5 daqiqadan past va «3 soatdan ko'p» + «qo'ng'iroq qilinmagan» — nolga yaqin.</p></div>`)}
    ${card(h3('Leadlar qancha kutdi', `${num(all.length)} ta lead — kutish oralig'i bo'yicha. Medianani shu yerdan tekshirish mumkin: yuqoridan sanab yarmiga yetgan qator.`) + rows.map(r => `<div class="flex items-center justify-between gap-3 py-1.5 text-[13px]"><span class="w-40 shrink-0">${r.t}</span>${bar(r.n, max, r.c, num(r.n))}<span class="text-muted tabular-nums w-14 text-right">${pct(div(r.n, all.length))}</span></div>`).join(''))}</div>`;
}

  const todayNotCalled = (d.speed || []).filter(r => !r.first_call_at && r.source === 'Target' && now - new Date(r.created_at) > 15 * 60000 && r.day === iso(new Date())).length;
  if (todayNotCalled) alerts.unshift({ level: 'danger', title: `Bugun ${todayNotCalled} ta reklama leadiga hali qo'ng'iroq qilinmagan (15 daqiqadan ko'p)`, msg: '', action: "Aloqa tezligi → «Qo'ng'iroq qilinmagan leadlar» ro'yxatini oching." });
  if (qd.failed > 20) alerts.push({ level: 'warn', title: `AI tahlilida ${qd.failed} ta qo'ng'iroq xato bilan to'xtagan`, msg: "Odatda bepul Gemini kunlik limiti tugaganda bo'ladi; ertasi kuni avtomatik qayta uriniladi.", action: '' });

  const tone = { danger: 'border-danger/40 bg-danger/5', warn: 'border-warn/40 bg-warn/5', info: 'border-line' };

// ---------- Plan vs fact ----------
const pctInput = (id, l, v, suffix = '%', step = '0.1') => `<label class="block"><span class="block text-xs font-semibold mb-1.5">${l}</span><div class="relative"><input id="${id}" type="number" min="0" step="${step}" value="${v}" class="w-full h-10 pl-3 pr-8 rounded-xl bg-surface2 border border-line text-sm"><span class="absolute right-3 top-2.5 text-xs text-muted">${suffix}</span></div></label>`;
const fmtP = v => +(v * 100).toFixed(1);
function planNeed(p) {
  const came = div(p.sales, +p.came_sale) || 0, qual = div(came, +p.qual_came) || 0, leads = div(qual, +p.lead_qual) || 0;
  const tShare = +(p.channels?.Target ?? 100) / 100, tLeads = leads * tShare;
  return { sales: +p.sales, came, qual, leads, tLeads, budget: tLeads * +p.cpl, cplan: tLeads ? +p.cpl : null };
}
// Ads worth acting on in the selected period, from Meta spend and Bitrix quality.
function adStats() {
  const d = S.data, by = {}, cat = Object.fromEntries(d.adCatalog.map(a => [a.id, a]));
  const get = id => by[id] ??= { id, name: cat[id]?.name || id, active: cat[id]?.status === 'ACTIVE', spend: 0, leads: 0, qual: 0, wrong: 0, geoLeads: 0 };
  for (const r of d.adDaily) get(r.ad_id).spend += +r.spend;
  for (const r of d.adLeads) { const o = get(r.ad_id); o.leads += +r.leads; o.qual += +r.qual; }
  for (const r of d.adGeo) { const o = get(r.ad_id); o.geoLeads += +r.leads; o.wrong += +r.wrong_loc; }
  return Object.values(by);
}
function planCauses(p, t, sold, need, scale) {
  const out = [], push = (tone, title, msg, action) => out.push({ tone, title, msg, action });
  const stages = [['Lead → sifatli', div(t.qual, t.leads), +p.lead_qual, "Auditoriya va lead formani tekshiring: quyidagi kreativlar va hudud isrofi."],
    ['Sifatli → filialga keldi', div(t.came_to_branch, t.qual), +p.qual_came, "Sifatli leadlarni demo darsga yozishni kuchaytiring: Jamoa → Qo'ng'iroqlar sahifasida «Sokrat» bosqichini tekshiring."],
    ['Filialga keldi → sotuv', div(t.won, t.came_to_branch), +p.came_sale, "Filiallardagi yopish suhbatini tekshiring. Yangi leadlar hali sotuvga ulgurmagan bo'lishi mumkin."]]
    .filter(x => x[1] != null && x[2]).map(x => [...x, x[1] / x[2]]);
  if (stages.length) { const w = [...stages].sort((a, b) => a[4] - b[4])[0];
    if (w[4] < 0.9) push('danger', `Eng tor joy: ${w[0]}`, `Fakt ${pct(w[1])}, reja ${pct(w[2])}: rejaning ${Math.round(w[4] * 100)}% i.`, w[3]); }
  const planLeads = need.leads * scale;
  if (planLeads && t.leads < planLeads * 0.9) push('warn', "Lead yetishmayapti", `${num(t.leads)} ta keldi, shu davr rejasi ${num(planLeads)} ta (${pct(div(t.leads, planLeads))}).`, "Byudjetni rejadagi darajaga oling yoki rejani kamaytiring.");
  const ads = adStats().filter(o => o.spend > 0);
  const zero = ads.filter(o => o.active && !o.qual && o.spend >= 15).sort((a, b) => b.spend - a.spend).slice(0, 3);
  if (zero.length) push('danger', "Pul yeyotgan, sifatli lead bermayotgan kreativlar", zero.map(o => `${esc(o.name)} — ${adMoney(o.spend, false)}, ${num(o.leads)} lead`).join('<br>'), "Bularni to'xtating yoki kreativini almashtiring.");
  const best = ads.filter(o => o.qual >= 2).sort((a, b) => a.spend / a.qual - b.spend / b.qual).slice(0, 3);
  if (best.length) push('success', 'Eng arzon sifatli lead berayotganlar', best.map(o => `${esc(o.name)} — ${adMoney(o.spend / o.qual, false)} / sifatli`).join('<br>'), "Byudjetni shularga ko'chiring.");
  const geoL = ads.reduce((a, o) => a + o.geoLeads, 0), geoW = ads.reduce((a, o) => a + o.wrong, 0), waste = ads.reduce((a, o) => a + (o.geoLeads ? o.spend * o.wrong / o.geoLeads : 0), 0);
  if (geoL >= 30 && geoW / geoL >= 0.1) push('warn', 'Boshqa viloyatdan leadlar', `${num(geoW)} ta lead (${pct(geoW / geoL)}) «Lokatsiya to'g'ri kelmadi»: taxminan ${adMoney(waste, false)} isrof.`, "Marketing → Lokatsiya isrofi sahifasida qaysi reklama ekanini ko'ring, geotargetni toraytiring.");
  const ch = groupSum(S.data.daily, r => channelOf(r.source)).filter(o => o.leads >= 30 && !o.qual);
  for (const o of ch) push('warn', `«${esc(o.key)}»: ${num(o.leads)} lead, sifatli 0`, 'Bu kanal umumiy konversiyani tushiryapti.', "Bu leadlar haqiqiy mijozmi, tekshiring; agar sinov bo'lsa, rejadan chiqaring.");
  if (t.in_progress >= 20) push('warn', `${num(t.in_progress)} ta lead hali hal bo'lmagan`, "Qo'ng'iroq qilinmagan yoki qayta aloqa kutayotgan leadlar.", "Menejerlar bugun shulardan boshlasin.");
  const ops = groupSum(S.data.operators, r => r.operator).filter(o => o.leads >= 20).map(o => ({ ...o, r: div(o.qual, o.leads) })).sort((a, b) => a.r - b.r);
  if (ops.length > 1 && ops[ops.length - 1].r > ops[0].r * 1.5) push('warn', 'Operatorlar orasida katta farq', `Eng past: ${esc(ops[0].key)} ${pct(ops[0].r)}, eng yuqori: ${esc(ops[ops.length - 1].key)} ${pct(ops[ops.length - 1].r)}.`, "Eng past operatorning qo'ng'iroqlarini ko'rib chiqing (Jamoa → Vazifalar).");
  return out;
}

  const steps = [['Ko\'rishlar', o.impr, 'CPM', m.cpm], ['Link klik', o.lclicks || o.clicks, 'CPC', m.cpc], ...(o.lpv ? [["Sahifa ko'rish", o.lpv, 'narxi', m.cplpv]] : []), ['Natija (Meta)', o.mleads, 'CPL', m.cpl],
    ["Lead (Bitrix)", o.leads, 'narxi', div(o.spend, o.leads)], ['Aloqa qilindi', o.contacted, '', null], ['Sifatli', o.qual, 'CPQL', m.cpql], ['Filialga keldi', o.came, 'narxi', div(o.spend, o.came)], ['Sotuv', o.won, 'CPP', m.cps]];
  const COL = ['blue', 'blue', 'violet', 'violet', 'violet', 'teal', 'teal', 'amber', 'green'];
  const bars = steps.map(([l, v, cl, cv], i) => {
    const prev = i ? steps[i - 1][1] : v, conv = div(v, prev), w = Math.max(Math.pow(div(v, steps[0][1]) || 0, 0.25) * 100, 26).toFixed(1);
    return (i ? `<div class="flex justify-center my-1"><span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold tabular-nums bg-surface2 text-muted"><i class="ph-bold ph-arrow-down"></i>${pct(conv)}</span></div>` : '') +
      `<div class="grid grid-cols-[minmax(0,1fr)_minmax(0,2fr)_minmax(0,1fr)] items-center gap-3"><div class="text-sm font-semibold">${l}</div><div class="flex justify-center"><div class="h-10 px-2 whitespace-nowrap rounded-xl flex items-center justify-center text-white font-bold tabular-nums" style="width:${w}%;background:rgb(var(--c-${COL[i % COL.length]}))">${num(v)}</div></div><div class="text-right text-sm">${cl && cv != null ? `<div class="font-semibold tabular-nums">${usd(cv)}</div><div class="text-[11px] text-muted">${cl}</div>` : ''}</div></div>`;
  }).join('');
  return card(`<div class="flex flex-wrap gap-3 mb-5">${sel('c', 'Kampaniya', camps, F.c)}${sel('s', 'Ad set', sets, F.s)}${sel('a', "E'lon", adList.map(a => [a.id, a.name || a.id]), F.a)}</div>` +
    `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${kpiTile('Xarajat', usd(o.spend), '', 'blue')}${kpiTile('Tushum', somMoney(o.revenue), `${num(o.won)} ta sotuv`, 'green')}${kpiTile('Foyda', somMoney(m.profit), 'tushum − xarajat', m.profit < 0 ? 'rose' : 'green')}${kpiTile('ROAS', m.roas == null ? '—' : m.roas.toFixed(2) + '×', "1 so'm reklamaga tushum", 'amber')}</div>` +
    h3('Reklama voronkasi', "Ko'rishdan sotuvgacha. Meta bosqichlari — xarajat kunlari, Bitrix bosqichlari — tanlangan davrda kelgan leadlar. Sotuv — tanlangan sana va atributsiya bo'yicha.") + bars);
}

// ---------- Sales list (won deals) ----------
function purchasesPage() {
  const cat = adCat(), Q = (S.pq || '').toLowerCase().replace(/\s/g, '');
  let rows = salesInRange().filter(p => !S.source || channelOf(p.a_source) === S.source);
  const all = rows;
  if (Q) rows = rows.filter(p => [p.name, p.phone, p.deal_title, p.deal_id, p.lead_id].some(x => String(x || '').toLowerCase().replace(/\s/g, '').includes(Q)));
  const rev = all.reduce((a, p) => a + (+p.amount || 0), 0), days = Math.round((new Date(S.to) - new Date(S.from)) / 864e5) + 1;
  const med = xs => { const a = [...xs].sort((x, y) => x - y); return a.length ? (a.length % 2 ? a[(a.length - 1) / 2] : (a[a.length / 2 - 1] + a[a.length / 2]) / 2) : null; };
  const avgDays = med(all.filter(p => p.deal_days != null && p.deal_days >= 0).map(p => +p.deal_days));
  const group = (keyFn, rowsIn = all) => { const by = {}; for (const p of rowsIn) { const k = keyFn(p); if (!k) continue; const o = by[k] ??= { key: k, n: 0, rev: 0, days: [] }; o.n++; o.rev += +p.amount || 0; if (p.deal_days != null && p.deal_days >= 0) o.days.push(+p.deal_days); } return Object.values(by); };
  const fastest = group(p => cat[p.a_ad]?.campaign).filter(o => o.n >= 2).map(o => ({ ...o, avg: med(o.days) })).filter(o => o.avg != null).sort((a, b) => a.avg - b.avg)[0];
  const spendBy = level => { const r = {}; for (const x of S.data.adDaily) { const a = cat[x.ad_id] || {}, k = level === 'ad' ? x.ad_id : level === 'adset' ? a.adset : a.campaign; if (k) r[k] = (r[k] || 0) + +x.spend; } return r; };
  const topTable = (title, level) => { const sp = spendBy(level), fx = fxRate(); const list = group(p => p.a_ad ? (level === 'ad' ? p.a_ad : level === 'adset' ? cat[p.a_ad]?.adset : cat[p.a_ad]?.campaign) || null : null).map(o => ({ ...o, name: level === 'ad' ? (cat[o.key]?.name || o.key) : o.key, spend: sp[o.key] || 0 })).map(o => ({ ...o, roas: fx && o.spend ? o.rev / (o.spend * fx) : null })).sort((a, b) => b.n - a.n || b.rev - a.rev);
    return card(h3(title) + table([{ t: 'Nomi', f: o => `<span class="font-semibold block max-w-[240px] truncate" title="${esc(o.name)}">${esc(o.name)}</span>` }, { t: 'Sotuv', r: 1, s: o => o.n, f: o => num(o.n) }, { t: 'Tushum', r: 1, s: o => o.rev, f: o => somMoney(o.rev) }, { t: 'Xarajat', r: 1, s: o => o.spend, f: o => adMoney(o.spend, false) }, { t: 'ROAS', r: 1, s: o => o.roas ?? -1, f: o => o.roas == null ? '—' : chip(o.roas.toFixed(2) + '×', o.roas >= 1 ? 'success' : 'danger') }], list, null, 10), 'mb-6'); };
  const sellers = group(p => p.manager).map(o => ({ ...o, avg: med(o.days) })).sort((a, b) => b.rev - a.rev);
  const chans = group(p => channelOf(p.a_source)).sort((a, b) => b.n - a.n), maxN = Math.max(1, ...chans.map(o => o.n));
  const listCols = [
    { t: 'Mijoz', s: p => p.name || '', f: p => `<div class="min-w-0 max-w-[220px]"><a href="${BX_DEAL(p.deal_id)}" target="_blank" rel="noopener" class="font-semibold hover:text-accent block truncate" title="${esc(p.name || p.deal_title || '')}">${esc(p.name || p.deal_title || 'Deal #' + p.deal_id)}</a><div class="text-[11px] text-muted tabular-nums">${fmtPhone(p.phone)}${p.lead_id ? ` · <a href="${BX_LEAD(p.lead_id)}" target="_blank" rel="noopener" class="hover:text-accent">#${p.lead_id}</a>` : ''}</div></div>` },
    { t: 'Manba', s: p => p.a_source, f: p => `<div class="text-[13px]">${esc(channelOf(p.a_source))}</div><div class="text-[11px] text-muted max-w-[140px] truncate">${esc(p.a_source || '')}</div>` },
    { t: 'Kampaniya', f: p => `<span class="block max-w-[200px] truncate text-[13px]" title="${esc(cat[p.a_ad]?.campaign || '')}">${esc(cat[p.a_ad]?.campaign || '—')}</span>` },
    { t: 'Ad set', f: p => `<span class="block max-w-[180px] truncate text-[13px]" title="${esc(cat[p.a_ad]?.adset || '')}">${esc(cat[p.a_ad]?.adset || '—')}</span>` },
    { t: "E'lon", f: p => `<span class="block max-w-[140px] truncate text-[13px]" title="${esc(cat[p.a_ad]?.name || '')}">${esc(cat[p.a_ad]?.name || (p.a_ad ? '#' + p.a_ad : '—'))}</span>` },
    { t: 'Menejer', f: p => `<span class="block max-w-[160px] truncate text-[13px]">${esc(String(p.manager || '—').split('|')[0].trim())}</span>` },
    { t: 'Summa', r: 1, s: p => +p.amount, f: p => somMoney(+p.amount) },
    { t: 'Muddat', r: 1, s: p => p.deal_days ?? 1e9, f: p => p.deal_days == null ? '—' : p.deal_days < 1 ? '< 1 kun' : `${(+p.deal_days).toFixed(1)} kun` },
    { t: 'Yopilgan', s: p => p.sold_at, f: p => `<span class="tabular-nums text-[13px]">${String(p.day).slice(8, 10)}.${String(p.day).slice(5, 7)} ${new Date(p.sold_at).toLocaleTimeString('uz', { hour: '2-digit', minute: '2-digit' })}</span>` },
  ];
  const listKey = listCols.map(c => c.t).join('|'), sorted = S.sort[listKey] ? rows : [...rows].sort((a, b) => String(b.sold_at).localeCompare(String(a.sold_at)));
  return `<div class="flex flex-wrap items-center justify-between gap-3 mb-4">${channelPills()}<div class="flex flex-wrap gap-2">${attrToggle()}</div></div>
    <div class="grid grid-cols-2 lg:grid-cols-6 gap-3 mb-6">${kpiTile('Tushum', somMoney(rev), `${num(all.length)} ta sotuv`, 'green')}${kpiTile('Sotuvlar', num(all.length), saleMode() ? 'shu davrda yopilgan' : 'shu davr leadlaridan', 'blue')}${kpiTile("O'rtacha chek", somMoney(div(rev, all.length)), '', 'violet')}${kpiTile('Odatiy muddat', avgDays == null ? '—' : avgDays.toFixed(1) + ' kun', 'lead kelgandan sotuvgacha (mediana)', 'amber')}${kpiTile('Eng tez kampaniya', fastest ? fastest.avg.toFixed(1) + ' kun' : '—', fastest ? esc(fastest.key) : 'kamida 2 ta sotuv kerak', 'teal')}${kpiTile('Kuniga tushum', somMoney(div(rev, days)), `${days} kun ichida`, 'rose')}</div>` +
    sections('purch', [
      ['list', 'Sotuvlar', () => card(`<div class="flex flex-wrap items-center gap-3 mb-3"><input value="${esc(S.pq || '')}" placeholder="Ism, telefon yoki deal raqami…" onchange="S.pq=this.value;render()" class="h-9 px-3 rounded-xl bg-surface2 border border-line text-sm w-full sm:w-72"><span class="text-xs text-muted ml-auto">${num(rows.length)} ta · ${ATTR_NOTE}</span></div>` + table(listCols, sorted, null, null, true))],
      ['top', 'Eng yaxshilari', () => `<div class="grid lg:grid-cols-2 gap-4">${topTable('Kampaniyalar', 'campaign')}${topTable('Ad setlar', 'adset')}${topTable("E'lonlar", 'ad')}${card(h3('Sotuvchilar', 'Deal egasi (filial menejeri)') + table([{ t: 'Menejer', f: o => `<span class="font-semibold">${esc(String(o.key).split('|')[0].trim())}</span><div class="text-[11px] text-muted">${esc(String(o.key).split('|').slice(1).join(' ').trim())}</div>` }, { t: 'Sotuv', r: 1, s: o => o.n, f: o => num(o.n) }, { t: 'Tushum', r: 1, s: o => o.rev, f: o => somMoney(o.rev) }, { t: 'Odatiy muddat', r: 1, s: o => o.avg ?? 1e9, f: o => o.avg == null ? '—' : o.avg.toFixed(1) + ' kun' }], sellers, null, 10), 'mb-6')}</div>`],
      ['src', 'Manbalar', () => card(h3('Sotuvlar qayerdan kelgan', 'Kanal — Mapping bo\'yicha') + chans.map(o => `<div class="flex items-center justify-between gap-3 py-2 border-b border-line/60 last:border-0 text-[13px]"><span class="w-40 shrink-0 font-semibold">${esc(o.key)}</span>${bar(o.n, maxN, 'blue', `${num(o.n)} · ${pct(div(o.n, all.length))}`)}<span class="w-32 text-right tabular-nums">${somMoney(o.rev)}</span></div>`).join('') || empty("Sotuv yo'q"))],
    ]);
}

// ---------- PDF report ----------
const REP_DEFAULT = ['spend', 'impr', 'lclicks', 'ctr', 'cpc', 'cpm', 'leads', 'qual', 'cpql', 'won', 'revenue', 'roas'];
function reportPage() {
  const R = S.rep ||= { level: 'campaign', keys: new Set(REP_DEFAULT), q: '' };
  let { rows, T } = adAgg(R.level);
  if (R.q) { const t = R.q.toLowerCase(); rows = rows.filter(o => [o.name, o.adset, o.campaign].some(x => String(x || '').toLowerCase().includes(t))); T = rows.reduce((t, o) => { for (const k of AD_SUMS) t[k] += o[k]; return t; }, { _foot: true, name: 'Jami', ...Object.fromEntries(AD_SUMS.map(x => [x, 0])) }); }
  rows = [...rows].sort((a, b) => b.spend - a.spend);
  const colsAll = adColumns(R.level, T, false), cols = colsAll.filter(c => c.fixed || R.keys.has(c.k));
  const box = c => `<label class="inline-flex items-center gap-2 text-sm mr-4 mb-1"><input type="checkbox" ${R.keys.has(c.k) ? 'checked' : ''} onchange="S.rep.keys[this.checked?'add':'delete']('${c.k}');render()" class="w-4 h-4">${c.t}</label>`;
  return `<div class="no-print">` + card(`<div class="flex flex-wrap items-center gap-3 mb-4">${segBtn([['campaign', 'Kampaniyalar'], ['adset', 'Ad setlar'], ['ad', "E'lonlar"]], R.level, "S.rep.level='$';render()")}${attrToggle()}<input value="${esc(R.q)}" placeholder="Nomi bo'yicha filtr…" onchange="S.rep.q=this.value;render()" class="h-9 px-3 rounded-xl bg-surface2 border border-line text-sm w-full sm:w-56"><button onclick="window.print()" class="h-9 px-4 rounded-xl bg-fg text-surface text-sm font-semibold ml-auto inline-flex items-center gap-1.5"><i class="ph-bold ph-file-pdf"></i>PDF yuklab olish</button></div>
    <div class="text-xs font-semibold mb-2">Ko'rsatkichlar</div><div>${colsAll.filter(c => !c.fixed).map(box).join('')}</div>
    <p class="text-[11px] text-muted mt-3">«PDF yuklab olish» → ochilgan oynada «Saqlash: PDF» ni tanlang. Davrni yuqoridagi kalendardan o'zgartiring.</p>`, 'mb-6') + `</div>` +
    card(`<div class="flex flex-wrap items-end justify-between gap-3 mb-4"><div><div class="text-lg font-bold">Reklama hisoboti — Robbit akademiyasi</div><div class="text-xs text-muted">${fmtDay(S.from)} — ${fmtDay(S.to)} · ${{ campaign: 'kampaniyalar', adset: 'ad setlar', ad: "e'lonlar" }[R.level]} bo'yicha · ${(S.attr || 'last') === 'first' ? 'First click' : 'Last click'} · ${saleMode() ? 'sotuv sanasi' : 'lead sanasi'}</div></div><div class="text-xs text-muted">Tayyorlandi: ${new Date().toLocaleString('uz')}</div></div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">${kpiTile('Xarajat', adMoney(T.spend, false), '', 'blue')}${kpiTile('Lead (Bitrix)', num(T.leads), `sifatli ${num(T.qual)}`, 'violet')}${kpiTile('Sotuv', num(T.won), somMoney(T.revenue), 'green')}${kpiTile('ROAS', adM(T).roas == null ? '—' : adM(T).roas.toFixed(2) + '×', `foyda ${somMoney(adM(T).profit)}`, 'amber')}</div>` +
    table(cols, rows, T, 100000, true), 'print-area');
}

const salesAll = () => merged('m_sales', [['list', 'Sotuvlar ro\'yxati', 'ph-receipt', purchasesPage], ['when', "Sotuv qachon bo'ladi", 'ph-hourglass-medium', cohort], ['money', "To'lovlar va sikl", 'ph-wallet', moneyPage]]);
const dailyAll = () => merged('m_daily', [['ch', 'Kunlar', 'ph-calendar-dots', daily], ['m', 'Kunlik metrikalar', 'ph-chart-bar', metricsPage]]);
const teamAll = () => merged('m_team', [['m', 'Menejerlar', 'ph-users', managers], ['c', "Qo'ng'iroqlar", 'ph-phone', calls]]);
const VIEWS = { purchases: salesAll, report: reportPage, integr: integrPage, mapping: mappingPage, geo: geoPage, economy: economyPage, tasks: tasksPage, overview, funnel, daily: dailyAll, leads, creatives, pains, managers: teamAll, speed: speedPage, branches: branchesPage, status: statusPage, guide: guidePage, briefs, ai, settings, users: usersPage };
function render() { $('app').innerHTML = shell(S.data.funnel ? VIEWS[S.page]() : card(empty('Yuklanmoqda…'))); }
// Starts the Meta / Bitrix / call syncs now (sync-now waits up to ~55 s), then reloads the data.
async function syncNow() {
  S.syncing = true; render();
  try {
    const { data } = await sbc.auth.getSession();
    const res = await fetch(`${SB_URL}/functions/v1/sync-now`, { method: 'POST', headers: { authorization: `Bearer ${data.session?.access_token}`, apikey: SB_KEY } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || res.status);
  } catch (e) { alert("Yangilab bo'lmadi: " + e.message); }
  S.syncing = false; await refresh();
}
async function refresh() {
  $('app').innerHTML = shell(card(empty('Yuklanmoqda…')));
  try { await load(); render(); loadCalls(); } catch (e) { $('app').innerHTML = shell(card(`<p class="text-sm text-danger">${esc(e.message)}</p>`)); }
}

function loginScreen(err = '') {
  $('app').innerHTML = `<div class="min-h-screen flex items-center justify-center px-4"><form onsubmit="login(event)" class="w-full max-w-sm bg-surface border border-line rounded-2xl shadow-card p-6 space-y-4">
    <div><h1 class="text-xl font-bold">Sotuv auditi</h1><p class="text-xs text-muted mt-1">Akkauntingiz bilan kiring</p></div>
    <input id="lgEmail" type="email" required placeholder="Email" autocomplete="email" class="w-full h-11 px-3 rounded-xl bg-surface2 border border-line text-sm">
    <input id="lgPass" type="password" required placeholder="Parol" autocomplete="current-password" class="w-full h-11 px-3 rounded-xl bg-surface2 border border-line text-sm">
    ${err ? `<p class="text-xs text-danger">${esc(err)}</p>` : ''}
    <button class="w-full h-11 rounded-xl bg-fg text-surface text-sm font-semibold">Kirish</button></form></div>`;
}
async function login(e) {
  e.preventDefault();
  const { error } = await sbc.auth.signInWithPassword({ email: $('lgEmail').value.trim(), password: $('lgPass').value });
  if (error) return loginScreen(error.message);
  boot();
}
async function boot() {
  const { data } = await sbc.auth.getSession();
  if (!data.session) return loginScreen();
  const { data: ok } = await sbc.rpc('is_admin');
  if (!ok) {
    const { data: me } = await sbc.from('staff').select('*').eq('user_id', data.session.user.id).maybeSingle();
    if (me) return staffBoot(me);
    await sbc.auth.signOut(); return loginScreen("Bu akkauntga ruxsat berilmagan.");
  }
  refresh();
}
boot();
</script>
